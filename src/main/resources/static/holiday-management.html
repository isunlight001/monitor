            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
            border-radius: 4px;

        .layui-table {
            margin: 0;

        .layui-table th {
            background-color: #f8f9fa;
        }
        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="layui-layout layui-layout-admin">
        <!-- 头部区域 -->
        <div class="layui-header">
            <div class="layui-logo">📈 基金监控系统</div>
            <!-- 头部区域左侧 -->
            <ul class="layui-nav layui-layout-left">
                <li class="layui-nav-item"><a href="index.html">首页</a></li>
            </ul>
            <!-- 头部区域右侧 -->
            <ul class="layui-nav layui-layout-right" id="userInfoNav">
                <li class="layui-nav-item">
                    <a href="javascript:;" id="userNameLink">
                        <img src="//tva1.sinaimg.cn/crop.0.0.118.118.180/5db11ff4gw1e77d3nqrv8j203k03kweg.jpg" class="layui-nav-img">
                        <span id="currentUserName">游客</span>
                    </a>
                    <dl class="layui-nav-child">
                        <dd><a href="javascript:void(0);" onclick="logout()">退出登录</a></dd>
                    </dl>
                </li>
            </ul>
        </div>

        <!-- 左侧导航区域 -->
        <div class="layui-side layui-bg-black">
            <div class="layui-side-scroll">
                <!-- 左侧导航区域 -->
                <ul class="layui-nav layui-nav-tree" lay-filter="navTree">
                    <li class="layui-nav-item">
                        <a href="index.html">首页</a>
                    </li>
                    <li class="layui-nav-item">
                        <a href="javascript:;">基金监控</a>
                        <dl class="layui-nav-child">
                            <dd><a href="fund-monitor.html">📊 基金监控</a></dd>
                            <dd><a href="index-data.html">💹 指数数据</a></dd>
                            <dd><a href="fund-backtest.html">🧪 基金回测</a></dd>
                        </dl>
                    </li>
                    <li class="layui-nav-item">
                        <a href="javascript:;">告警管理</a>
                        <dl class="layui-nav-child">
                            <dd><a href="alert-records.html">🔔 告警记录</a></dd>
                            <dd><a href="notification-test.html">📧 通知测试</a></dd>
                        </dl>
                    </li>
                    <li class="layui-nav-item layui-nav-itemed">
                        <a href="javascript:;">系统管理</a>
                        <dl class="layui-nav-child">
                            <dd><a href="email-recipient-management.html">👥 邮件接收人</a></dd>
                            <dd><a href="system-config.html">⚙️ 系统配置</a></dd>
                            <dd><a href="holiday-management.html">📅 节假日管理</a></dd>
                        </dl>
                    </li>
                    <li class="layui-nav-item">
                        <a href="stock-management.html">📈 股票管理</a>
                    </li>
                </ul>
            </div>
        </div>

        <!-- 内容主体区域 -->
        <div class="layui-body">
            <!-- 内容区 -->
            <div style="padding: 15px;">
                <div class="layui-card">
                    <div class="layui-card-header">
                        <i class="layui-icon layui-icon-date"></i> 节假日管理
                        <button class="layui-btn layui-btn-sm layui-btn-normal" style="float: right;" onclick="refreshData()">
                            <i class="layui-icon layui-icon-refresh"></i> 刷新数据
                        </button>
                    </div>
                    <div class="layui-card-body">
                        <form class="layui-form" lay-filter="holidayForm">
                            <div class="layui-form-item">
                                <div class="layui-inline">
                                    <label class="layui-form-label">检查日期</label>
                                    <div class="layui-input-inline">
                                        <input type="text" class="layui-input" id="checkDate" placeholder="请选择日期">
                                    </div>
                                    <button class="layui-btn" type="button" onclick="checkHoliday()">
                                        <i class="layui-icon layui-icon-search"></i> 检查
                                    </button>
                                </div>
                            </div>
                        </form>
                        
                        <table class="layui-hide" id="holidayTable" lay-filter="holidayTable"></table>
                    </div>
                </div>
                
                <!-- 操作按钮 -->
                <div class="layui-card" style="margin-top: 20px;">
                    <div class="layui-card-header">
                        <i class="layui-icon layui-icon-util"></i> 操作面板
                    </div>
                    <div class="layui-card-body">
                        <div class="layui-row layui-col-space15">
                            <div class="layui-col-md3">
                                <button class="layui-btn layui-btn-fluid" onclick="showAddDialog()">
                                    <i class="layui-icon layui-icon-add-1"></i> 添加节假日
                                </button>
                            </div>
                            <div class="layui-col-md3">
                                <button class="layui-btn layui-btn-warm layui-btn-fluid" onclick="showRemoveDialog()">
                                    <i class="layui-icon layui-icon-delete"></i> 移除节假日
                                </button>
                            </div>
                            <div class="layui-col-md3">
                                <button class="layui-btn layui-btn-normal layui-btn-fluid" onclick="reloadHolidays()">
                                    <i class="layui-icon layui-icon-refresh"></i> 重新加载配置
                                </button>
                            </div>
                            <div class="layui-col-md3">
                                <button class="layui-btn layui-btn-primary layui-btn-fluid" onclick="showAllHolidays()">
                                    <i class="layui-icon layui-icon-list"></i> 查看所有节假日
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部固定区域 -->
        <div class="layui-footer footer">
            © 2025 基金监控系统 - 专业的基金数据分析平台
        </div>

    <script type="text/html" id="holidayToolbar">
        <div class="layui-btn-container">
            <button class="layui-btn layui-btn-sm" lay-event="add">添加节假日</button>
            <button class="layui-btn layui-btn-sm layui-btn-warm" lay-event="reload">重新加载</button>
        </div>
    </script>

    <script type="text/html" id="holidayBar">
        <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">移除</a>
    </script>

    <script src="https://cdn.jsdelivr.net/npm/layui@2.8.18/dist/layui.js"></script>
    <script>
        // 初始化Layui组件
        layui.use(['element', 'table', 'form', 'layer', 'laydate'], function(){
            var element = layui.element;
            var table = layui.table;
            var form = layui.form;
            var layer = layui.layer;
            var laydate = layui.laydate;
            
            // 页面加载时检查登录状态
            checkLoginStatus();
            
            // 初始化日期选择器
            laydate.render({
                elem: '#checkDate',
                theme: '#409eff'
            });
        });
        
        // 检查登录状态
        async function checkLoginStatus() {
            try {
                const response = await fetch('/api/users/status');
                const result = await response.json();

                if (result.success) {
                    // 显示用户信息
                    document.getElementById('currentUserName').textContent = result.data.username;
                } else {
                    // 未登录，跳转到登录页面
                    window.location.href = 'login.html';
                }
            } catch (error) {
                console.error('检查登录状态失败:', error);
                // 跳转到登录页面
                window.location.href = 'login.html';
            }
        }

        // 用户登出
        async function logout() {
            try {
                const response = await fetch('/api/users/logout', {
                    method: 'POST'
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    // 登出成功，跳转到登录页面
                    window.location.href = 'login.html';
                } else {
                    alert('登出失败: ' + result.message);
                }
            } catch (error) {
                alert('登出失败: ' + error.message);
            }
        }
        
        // 刷新数据
        function refreshData() {
            // 重新加载页面数据
            location.reload();
        }
        
        // 显示添加节假日对话框
        function showAddDialog() {
            layer.prompt({
                formType: 0,
                value: '',
                title: '请输入节假日日期 (格式: YYYY-MM-DD)',
                area: ['300px', '50px']
            }, function(value, index, elem) {
                if (!value) {
                    layer.msg('请输入日期', {icon: 2});
                    return;
                }
                
                // 验证日期格式
                var dateRegex = /^\d{4}-\d{2}-\d{2}$/;
                if (!dateRegex.test(value)) {
                    layer.msg('日期格式不正确，请使用 YYYY-MM-DD 格式', {icon: 2});
                    return;
                }
                
                addHoliday(value);
                layer.close(index);
            });
        }
        
        // 显示移除节假日对话框
        function showRemoveDialog() {
            layer.prompt({
                formType: 0,
                value: '',
                title: '请输入要移除的节假日日期 (格式: YYYY-MM-DD)',
                area: ['300px', '50px']
            }, function(value, index, elem) {
                if (!value) {
                    layer.msg('请输入日期', {icon: 2});
                    return;
                }
                
                // 验证日期格式
                var dateRegex = /^\d{4}-\d{2}-\d{2}$/;
                if (!dateRegex.test(value)) {
                    layer.msg('日期格式不正确，请使用 YYYY-MM-DD 格式', {icon: 2});
                    return;
                }
                
                removeHoliday(value);
                layer.close(index);
            });
        }
        
        // 检查节假日
        function checkHoliday() {
            var date = document.getElementById('checkDate').value;
            if (!date) {
                layer.msg('请选择日期', {icon: 2});
                return;
            }
            
            fetch('/api/holidays/check?date=' + date)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        layer.msg(data.message, {icon: 1});
                    } else {
                        layer.msg(data.message, {icon: 2});
                    }
                })
                .catch(error => {
                    layer.msg('检查失败: ' + error.message, {icon: 2});
                });
        }
        
        // 添加节假日
        function addHoliday(date) {
            if (!date) {
                layer.msg('请输入日期', {icon: 2});
                return;
            }
            
            fetch('/api/holidays/add?date=' + date, {
                method: 'POST'
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        layer.msg(data.message, {icon: 1});
                        // 重新加载节假日列表
                        showAllHolidays();
                    } else {
                        layer.msg(data.message, {icon: 2});
                    }
                })
                .catch(error => {
                    layer.msg('添加失败: ' + error.message, {icon: 2});
                });
        }
        
        // 移除节假日
        function removeHoliday(date) {
            if (!date) {
                layer.msg('请输入日期', {icon: 2});
                return;
            }
            
            fetch('/api/holidays/remove?date=' + date, {
                method: 'DELETE'
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        layer.msg(data.message, {icon: 1});
                        // 重新加载节假日列表
                        showAllHolidays();
                    } else {
                        layer.msg(data.message, {icon: 2});
                    }
                })
                .catch(error => {
                    layer.msg('移除失败: ' + error.message, {icon: 2});
                });
        }
        
        // 重新加载节假日配置
        function reloadHolidays() {
            fetch('/api/holidays/reload', {
                method: 'POST'
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        layer.msg(data.message, {icon: 1});
                        // 重新加载节假日列表
                        showAllHolidays();
                    } else {
                        layer.msg(data.message, {icon: 2});
                    }
                })
                .catch(error => {
                    layer.msg('重新加载失败: ' + error.message, {icon: 2});
                });
        }
        
        // 查看所有节假日
        function showAllHolidays() {
            fetch('/api/holidays/all')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        // 使用Layui表格显示节假日列表
                        layui.table.render({
                            elem: '#holidayTable',
                            data: data.data.map(date => ({date: date})),
                            cols: [[
                                {field: 'date', title: '节假日日期', minWidth: 150}
                            ]],
                            page: true,
                            limit: 10
                        });
                    } else {
                        layer.msg('获取节假日列表失败: ' + data.message, {icon: 2});
                    }
                })
                .catch(error => {
                    layer.msg('获取节假日列表失败: ' + error.message, {icon: 2});
                });
        }
    </script>
</body>
</html>
