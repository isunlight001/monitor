<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON格式化工具 - 基金监控系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .content {
            padding: 30px;
        }

        .card {
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            border: 1px solid rgba(0, 0, 0, 0.125);
        }
        
        .card-header {
            background-color: #fff;
            border-bottom: 1px solid rgba(0, 0, 0, 0.125);
        }

        .form-control, .form-select {
            border-radius: 8px;
            padding: 10px 15px;
        }

        .btn {
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #6c757d 0%, #5a6268 100%);
            border: none;
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-success {
            background: linear-gradient(135deg, #28a745 0%, #218838 100%);
            border: none;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-danger {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            border: none;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .result {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            display: none;
        }

        .result.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .result.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .result.show {
            display: block;
        }

        .json-editor {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            min-height: 500px;
            height: 500px;
            resize: vertical;
            width: 100%;
            border: 1px solid #ced4da;
            border-radius: 8px;
            padding: 15px;
            background-color: #fafafa;
            transition: border-color 0.3s;
        }

        .json-editor:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
            outline: none;
        }

        .json-editor:hover {
            border-color: #667eea;
        }

        .json-output {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            min-height: 500px;
            height: 500px;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            overflow: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .json-output.valid {
            color: #28a745;
        }

        .json-output.invalid {
            color: #dc3545;
        }

        .nav-tabs .nav-link.active {
            background-color: #fff;
            border-bottom-color: #fff;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            border-top: 1px solid #eee;
            margin-top: 30px;
        }
        
        .input-label, .output-label {
            font-weight: 500;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }
        
        .input-label i, .output-label i {
            margin-right: 8px;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="content">
        <div class="card">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0"><i class="bi bi-braces me-2"></i>JSON格式化工具</h4>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="input-label">
                                <i class="bi bi-file-earmark-code"></i>
                                原始JSON
                            </label>
                            <textarea id="jsonInput" class="form-control json-editor" placeholder="请输入JSON数据..."></textarea>
                        </div>
                        <div class="d-flex gap-2 flex-wrap">
                            <button type="button" class="btn btn-primary" id="formatBtn">
                                <i class="bi bi-braces me-1"></i>格式化
                            </button>
                            <button type="button" class="btn btn-secondary" id="minifyBtn">
                                <i class="bi bi-dash-square me-1"></i>压缩
                            </button>
                            <button type="button" class="btn btn-success" id="validateBtn">
                                <i class="bi bi-check-circle me-1"></i>验证
                            </button>
                            <button type="button" class="btn btn-danger" id="clearBtn">
                                <i class="bi bi-x-circle me-1"></i>清空
                            </button>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="output-label">
                                <i class="bi bi-file-check"></i>
                                处理结果
                            </label>
                            <div id="jsonOutput" class="json-output">格式化后的JSON将显示在这里...</div>
                        </div>
                        <div class="d-flex gap-2 flex-wrap">
                            <button type="button" class="btn btn-primary" id="copyBtn">
                                <i class="bi bi-clipboard me-1"></i>复制
                            </button>
                            <button type="button" class="btn btn-success" id="downloadBtn">
                                <i class="bi bi-download me-1"></i>下载
                            </button>
                        </div>
                    </div>
                </div>
                
                <div class="result" id="resultMessage"></div>
                
                <div class="mt-4">
                    <h5>使用说明</h5>
                    <ul>
                        <li>在左侧输入框中粘贴或输入原始JSON数据</li>
                        <li>点击"格式化"按钮查看格式化后的JSON</li>
                        <li>点击"压缩"按钮查看压缩后的JSON</li>
                        <li>点击"验证"按钮检查JSON格式是否正确</li>
                        <li>点击"复制"按钮将结果复制到剪贴板</li>
                        <li>点击"下载"按钮将结果保存为JSON文件</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    
    <div class="footer">
        <p>© 2025 基金监控系统 - 专业的基金数据分析平台</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            initializeJsonFormatter();
        });
        
        // 初始化JSON格式化工具
        function initializeJsonFormatter() {
            // 绑定按钮事件
            document.getElementById('formatBtn').addEventListener('click', formatJson);
            document.getElementById('minifyBtn').addEventListener('click', minifyJson);
            document.getElementById('validateBtn').addEventListener('click', validateJson);
            document.getElementById('clearBtn').addEventListener('click', clearJson);
            document.getElementById('copyBtn').addEventListener('click', copyJson);
            document.getElementById('downloadBtn').addEventListener('click', downloadJson);
            
            // 绑定输入框事件
            document.getElementById('jsonInput').addEventListener('input', function() {
                // 输入时自动验证语法
                validateSyntax();
            });
        }
        
        // 格式化JSON
        function formatJson() {
            const input = document.getElementById('jsonInput').value.trim();
            if (!input) {
                showResult('resultMessage', false, '请输入JSON数据');
                return;
            }
            
            try {
                const parsed = JSON.parse(input);
                const formatted = JSON.stringify(parsed, null, 2);
                document.getElementById('jsonOutput').textContent = formatted;
                document.getElementById('jsonOutput').className = 'json-output valid';
                showResult('resultMessage', true, 'JSON格式化成功');
            } catch (error) {
                showResult('resultMessage', false, 'JSON格式错误: ' + error.message);
                document.getElementById('jsonOutput').className = 'json-output invalid';
            }
        }
        
        // 压缩JSON
        function minifyJson() {
            const input = document.getElementById('jsonInput').value.trim();
            if (!input) {
                showResult('resultMessage', false, '请输入JSON数据');
                return;
            }
            
            try {
                const parsed = JSON.parse(input);
                const minified = JSON.stringify(parsed);
                document.getElementById('jsonOutput').textContent = minified;
                document.getElementById('jsonOutput').className = 'json-output valid';
                showResult('resultMessage', true, 'JSON压缩成功');
            } catch (error) {
                showResult('resultMessage', false, 'JSON格式错误: ' + error.message);
                document.getElementById('jsonOutput').className = 'json-output invalid';
            }
        }
        
        // 验证JSON
        function validateJson() {
            const input = document.getElementById('jsonInput').value.trim();
            if (!input) {
                showResult('resultMessage', false, '请输入JSON数据');
                return;
            }
            
            try {
                const parsed = JSON.parse(input);
                document.getElementById('jsonOutput').textContent = JSON.stringify(parsed, null, 2);
                document.getElementById('jsonOutput').className = 'json-output valid';
                showResult('resultMessage', true, 'JSON格式正确');
            } catch (error) {
                showResult('resultMessage', false, 'JSON格式错误: ' + error.message);
                document.getElementById('jsonOutput').className = 'json-output invalid';
            }
        }
        
        // 验证语法（实时）
        function validateSyntax() {
            const input = document.getElementById('jsonInput').value.trim();
            if (!input) {
                document.getElementById('jsonInput').style.borderColor = '#ced4da';
                return;
            }
            
            try {
                JSON.parse(input);
                document.getElementById('jsonInput').style.borderColor = '#28a745';
            } catch (error) {
                document.getElementById('jsonInput').style.borderColor = '#dc3545';
            }
        }
        
        // 清空
        function clearJson() {
            document.getElementById('jsonInput').value = '';
            document.getElementById('jsonOutput').textContent = '格式化后的JSON将显示在这里...';
            document.getElementById('jsonOutput').className = 'json-output';
            document.getElementById('jsonInput').style.borderColor = '#ced4da';
            showResult('resultMessage', true, '已清空');
        }
        
        // 复制JSON
        async function copyJson() {
            const output = document.getElementById('jsonOutput').textContent;
            if (!output || output === '格式化后的JSON将显示在这里...') {
                showResult('resultMessage', false, '没有可复制的内容');
                return;
            }
            
            try {
                await navigator.clipboard.writeText(output);
                showResult('resultMessage', true, '已复制到剪贴板');
            } catch (error) {
                showResult('resultMessage', false, '复制失败: ' + error.message);
            }
        }
        
        // 下载JSON
        function downloadJson() {
            const output = document.getElementById('jsonOutput').textContent;
            if (!output || output === '格式化后的JSON将显示在这里...') {
                showResult('resultMessage', false, '没有可下载的内容');
                return;
            }
            
            const blob = new Blob([output], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'formatted.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showResult('resultMessage', true, '文件已下载');
        }
        
        // 显示结果
        function showResult(elementId, isSuccess, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.className = 'result ' + (isSuccess ? 'success' : 'error') + ' show';

            // 3秒后自动隐藏
            setTimeout(() => {
                element.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
