<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基金监控系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .content {
            padding: 30px;
        }

        .form-section {
            margin-bottom: 30px;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
        }

        .form-section h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .form-control {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            background-color: white;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(56, 239, 125, 0.4);
        }

        .btn-info {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
        }

        .btn-info:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(52, 152, 219, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 75, 43, 0.4);
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .result.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .nav-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .nav-table th,
        .nav-table td {
            border: none;
            padding: 12px 15px;
            text-align: left;
        }

        .nav-table th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 500;
        }

        .nav-table tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        .nav-table tr:hover {
            background-color: #e3f2fd;
        }

        .positive {
            color: #e74c3c;
            font-weight: bold;
        }

        .negative {
            color: #27ae60;
            font-weight: bold;
        }

        .config-info {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 0 8px 8px 0;
        }

        .config-info h4 {
            margin-bottom: 15px;
            color: #1976d2;
        }

        .config-info ul {
            margin-left: 20px;
            line-height: 1.8;
        }

        .config-info code {
            background: #fff;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }
        
        @media (max-width: 768px) {
            .form-group input,
            .form-group textarea,
            .form-group select {
                font-size: 16px; /* 防止iOS缩放 */
            }
        }
    </style>
    <!-- 引入公共header样式 -->
    <link rel="stylesheet" href="css/header.css">
</head>
<body>
    <div class="container">
        <!-- 引入公共header -->
        <div id="header-placeholder"></div>

        <div class="content">
            <!-- 配置说明 -->
            <div class="config-info">
                <h4>⚙️ 系统说明</h4>
                <ul>
                    <li><strong>定时任务：</strong>每晚11点自动抓取基金数据并执行监控</li>
                    <li><strong>监控规则：</strong>
                        <ul>
                            <li>规则A：连续5天或以上上涨/下跌</li>
                            <li>规则B：单日涨跌幅绝对值≥5%</li>
                            <li>规则C：连续2天累计涨跌幅绝对值≥4%</li>
                            <li>规则D：连续3天累计涨跌幅绝对值≥5%</li>
                            <li>规则E：连续4天累计涨跌幅绝对值≥5%</li>
                        </ul>
                    </li>
                    <li><strong>告警方式：</strong>邮件通知（收件人：默认收件人）</li>
                </ul>
            </div>

            <!-- 手工触发预警 -->
            <div class="form-section">
                <h3>🚨 手工触发预警</h3>
                <p>立即对所有启用的监控基金执行数据更新和预警检查</p>
                <button class="btn btn-danger" onclick="triggerAllMonitorFunds()">立即执行预警</button>
                <div class="result" id="triggerResult"></div>
            </div>

            <!-- 基金数据抓取 -->
            <div class="form-section">
                <h3>📥 基金数据抓取</h3>
                <div class="form-group">
                    <label>基金代码*</label>
                    <select id="fundCode" class="form-control">
                        <option value="">请选择基金代码</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>基金名称*</label>
                    <input type="text" id="fundName" placeholder="例如: 国金量化多因子" value="国金量化多因子">
                </div>
                <div class="form-group">
                    <label>开始日期（可选）</label>
                    <input type="date" id="startDate">
                </div>
                <div class="form-group">
                    <label>结束日期（可选）</label>
                    <input type="date" id="endDate">
                </div>
                <button class="btn btn-primary" onclick="crawlFundData()">抓取基金数据</button>
                <button class="btn btn-info" onclick="incrementalUpdate()">增量更新</button>
                <div class="result" id="crawlResult"></div>
            </div>

            <!-- 基金监控检查 -->
            <div class="form-section">
                <h3>🔍 基金监控检查</h3>
                <div class="form-group">
                    <label>基金代码*</label>
                    <select id="checkFundCode" class="form-control">
                        <option value="">请选择基金代码</option>
                    </select>
                </div>
                <button class="btn btn-success" onclick="checkFund()">执行监控检查</button>
                <div class="result" id="checkResult"></div>
            </div>

            <!-- 查询基金净值 -->
            <div class="form-section">
                <h3>📊 查询基金净值</h3>
                <div class="form-group">
                    <label>基金代码*</label>
                    <select id="queryFundCode" class="form-control">
                        <option value="">请选择基金代码</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>查询天数</label>
                    <input type="number" id="queryDays" placeholder="例如: 30" value="30" min="1" max="365">
                </div>
                <button class="btn btn-info" onclick="queryFundNav()">查询净值数据</button>
                <div class="result" id="queryResult"></div>
                <div id="navTableContainer"></div>
            </div>

            <!-- 监控基金管理 -->
            <div class="form-section">
                <h3>📋 监控基金管理</h3>
                <div class="form-group">
                    <label>基金代码*</label>
                    <input type="text" id="monitorFundCode" class="form-control" placeholder="请输入基金代码">
                </div>
                <div class="form-group">
                    <label>基金名称*</label>
                    <input type="text" id="monitorFundName" placeholder="例如: 国金量化多因子">
                </div>
                <button class="btn btn-primary" onclick="addMonitorFund()">添加监控基金</button>
                <button class="btn btn-info" onclick="loadMonitorFunds()">刷新监控列表</button>
                <div class="result" id="monitorResult"></div>
                <div id="monitorFundsTableContainer"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/fund/monitor';

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadHeader(); // 加载公共header
            initializeFundCodeAutocomplete();
            initializeCheckFundCodeAutocomplete();
            initializeQueryFundCodeAutocomplete();
            loadMonitorFunds(); // 页面加载时自动加载监控基金列表
            
            // 设置默认日期为最近5年
            const today = new Date();
            const fiveYearsAgo = new Date();
            fiveYearsAgo.setFullYear(today.getFullYear() - 5);
            
            const startDateStr = fiveYearsAgo.toISOString().split('T')[0];
            const endDateStr = today.toISOString().split('T')[0];
            
            document.getElementById('startDate').value = startDateStr;
            document.getElementById('endDate').value = endDateStr;
            
            // 加载公共footer
            loadFooter();
        });
        
        // 加载公共header
        function loadHeader() {
            fetch('components/header.html')
                .then(response => response.text())
                .then(html => {
                    document.getElementById('header-placeholder').innerHTML = html;
                    // 检查登录状态
                    checkLoginStatus();
                })
                .catch(error => {
                    console.error('加载公共header失败:', error);
                });
        }
        
        // 加载公共footer
        function loadFooter() {
            fetch('components/footer.html')
                .then(response => response.text())
                .then(html => {
                    document.getElementById('footer-placeholder').innerHTML = html;
                })
                .catch(error => {
                    console.error('加载公共footer失败:', error);
                });
        }
        
        // 显示结果消息
        function showMessage(elementId, message, isSuccess) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.className = 'result show ' + (isSuccess ? 'success' : 'error');
            
            // 3秒后自动隐藏
            setTimeout(() => {
                element.classList.remove('show');
            }, 3000);
        }
        
        // 基金代码下拉框初始化
        function initializeFundCodeAutocomplete() {
            const select = document.getElementById('fundCode');
            
            // 从数据库获取基金列表并填充下拉框
            fetch(`${API_BASE}/monitor-funds`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const fundList = data.data || [];
                        
                        // 清空现有选项（除了默认选项）
                        select.innerHTML = '<option value="">请选择基金代码</option>';
                        
                        // 添加基金选项
                        fundList.forEach(fund => {
                            const option = document.createElement('option');
                            option.value = fund.fundCode;
                            option.textContent = `${fund.fundCode} - ${fund.fundName}`;
                            select.appendChild(option);
                        });
                        
                        // 监听基金代码选择变化，自动获取基金名称
                        select.addEventListener('change', function() {
                            const fundCodeValue = this.value.trim();
                            if (fundCodeValue) {
                                // 首先检查是否在基金列表中
                                const foundFund = fundList.find(fund => fund.fundCode === fundCodeValue);
                                if (foundFund) {
                                    document.getElementById('fundName').value = foundFund.fundName;
                                } else {
                                    // 如果不在列表中，尝试从API获取基金名称
                                    fetch(`${API_BASE}/fund-name?fundCode=${fundCodeValue}`)
                                        .then(response => response.json())
                                        .then(data => {
                                            if (data.success) {
                                                document.getElementById('fundName').value = data.fundName;
                                            }
                                        })
                                        .catch(error => {
                                            console.error('获取基金名称失败:', error);
                                        });
                                }
                            }
                        });
                    }
                })
                .catch(error => {
                    console.error('获取基金列表失败:', error);
                    // 如果获取失败，使用示例数据
                    const defaultSuggestions = [
                        {code: '006195', name: '国金量化多因子'},
                        {code: '000001', name: '华夏成长混合'},
                        {code: '161725', name: '招商中证白酒指数'},
                        {code: '001186', name: '华夏沪深300ETF联接A'},
                        {code: '110022', name: '易方达消费行业'}
                    ];
                    
                    // 清空现有选项（除了默认选项）
                    select.innerHTML = '<option value="">请选择基金代码</option>';
                    
                    // 添加默认选项
                    defaultSuggestions.forEach(fund => {
                        const option = document.createElement('option');
                        option.value = fund.code;
                        option.textContent = `${fund.code} - ${fund.name}`;
                        select.appendChild(option);
                    });
                    
                    // 监听基金代码选择变化，自动获取基金名称
                    select.addEventListener('change', function() {
                        const fundCodeValue = this.value.trim();
                        if (fundCodeValue) {
                            // 首先检查是否在基金列表中
                            const foundFund = defaultSuggestions.find(fund => fund.code === fundCodeValue);
                            if (foundFund) {
                                document.getElementById('fundName').value = foundFund.name;
                            }
                        }
                    });
                });
        }
        

        
        // 初始化检查基金代码下拉框
        function initializeCheckFundCodeAutocomplete() {
            const select = document.getElementById('checkFundCode');
            
            // 从数据库获取基金列表并填充下拉框
            fetch(`${API_BASE}/monitor-funds`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const fundList = data.data || [];
                        
                        // 清空现有选项（除了默认选项）
                        select.innerHTML = '<option value="">请选择基金代码</option>';
                        
                        // 添加基金选项
                        fundList.forEach(fund => {
                            const option = document.createElement('option');
                            option.value = fund.fundCode;
                            option.textContent = `${fund.fundCode} - ${fund.fundName}`;
                            select.appendChild(option);
                        });
                    }
                })
                .catch(error => {
                    console.error('获取基金列表失败:', error);
                    // 如果获取失败，使用示例数据
                    const defaultSuggestions = [
                        {code: '006195', name: '国金量化多因子'},
                        {code: '000001', name: '华夏成长混合'},
                        {code: '161725', name: '招商中证白酒指数'},
                        {code: '001186', name: '华夏沪深300ETF联接A'},
                        {code: '110022', name: '易方达消费行业'}
                    ];
                    
                    // 清空现有选项（除了默认选项）
                    select.innerHTML = '<option value="">请选择基金代码</option>';
                    
                    // 添加默认选项
                    defaultSuggestions.forEach(fund => {
                        const option = document.createElement('option');
                        option.value = fund.code;
                        option.textContent = `${fund.code} - ${fund.name}`;
                        select.appendChild(option);
                    });
                });
        }
        
        // 初始化查询基金代码下拉框
        function initializeQueryFundCodeAutocomplete() {
            const select = document.getElementById('queryFundCode');
            
            // 从数据库获取基金列表并填充下拉框
            fetch(`${API_BASE}/monitor-funds`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const fundList = data.data || [];
                        
                        // 清空现有选项（除了默认选项）
                        select.innerHTML = '<option value="">请选择基金代码</option>';
                        
                        // 添加基金选项
                        fundList.forEach(fund => {
                            const option = document.createElement('option');
                            option.value = fund.fundCode;
                            option.textContent = `${fund.fundCode} - ${fund.fundName}`;
                            select.appendChild(option);
                        });
                    }
                })
                .catch(error => {
                    console.error('获取基金列表失败:', error);
                    // 如果获取失败，使用示例数据
                    const defaultSuggestions = [
                        {code: '006195', name: '国金量化多因子'},
                        {code: '000001', name: '华夏成长混合'},
                        {code: '161725', name: '招商中证白酒指数'},
                        {code: '001186', name: '华夏沪深300ETF联接A'},
                        {code: '110022', name: '易方达消费行业'}
                    ];
                    
                    // 清空现有选项（除了默认选项）
                    select.innerHTML = '<option value="">请选择基金代码</option>';
                    
                    // 添加默认选项
                    defaultSuggestions.forEach(fund => {
                        const option = document.createElement('option');
                        option.value = fund.code;
                        option.textContent = `${fund.code} - ${fund.name}`;
                        select.appendChild(option);
                    });
                });
        }
        
        // 监控基金代码选择不需要初始化，因为使用对话框
        
        // 手工触发所有监控基金预警
        function triggerAllMonitorFunds() {
            if (!confirm('确定要立即执行所有基金的预警检查吗？')) {
                return;
            }
            
            fetch(`${API_BASE}/trigger-all`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showMessage('triggerResult', data.message, true);
                } else {
                    showMessage('triggerResult', data.message, false);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showMessage('triggerResult', '执行失败: ' + error.message, false);
            });
        }
        
        // 抓取基金数据
        function crawlFundData() {
            const fundCode = document.getElementById('fundCode').value.trim();
            const fundName = document.getElementById('fundName').value.trim();
            let startDate = document.getElementById('startDate').value;
            let endDate = document.getElementById('endDate').value;
            
            // 如果没有提供日期，则默认为最近5年
            if (!startDate || !endDate) {
                const today = new Date();
                const fiveYearsAgo = new Date();
                fiveYearsAgo.setFullYear(today.getFullYear() - 5);
                
                endDate = endDate || today.toISOString().split('T')[0];
                startDate = startDate || fiveYearsAgo.toISOString().split('T')[0];
                
                // 更新页面上的日期输入框
                document.getElementById('startDate').value = startDate;
                document.getElementById('endDate').value = endDate;
            }
            
            if (!fundCode || !fundName) {
                showMessage('crawlResult', '请填写基金代码和基金名称', false);
                return;
            }
            
            const params = new URLSearchParams({
                fundCode: fundCode,
                fundName: fundName,
                startDate: startDate,
                endDate: endDate
            });
            
            fetch(`${API_BASE}/crawl?${params}`, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showMessage('crawlResult', data.message, true);
                } else {
                    showMessage('crawlResult', data.message, false);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showMessage('crawlResult', '抓取失败: ' + error.message, false);
            });
        }
        
        // 增量更新
        function incrementalUpdate() {
            const fundCode = document.getElementById('fundCode').value.trim();
            const fundName = document.getElementById('fundName').value.trim();
            
            if (!fundCode || !fundName) {
                showMessage('crawlResult', '请填写基金代码和基金名称', false);
                return;
            }
            
            const params = new URLSearchParams({
                fundCode: fundCode,
                fundName: fundName
            });
            
            fetch(`${API_BASE}/update?${params}`, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showMessage('crawlResult', data.message, true);
                } else {
                    showMessage('crawlResult', data.message, false);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showMessage('crawlResult', '更新失败: ' + error.message, false);
            });
        }
        
        // 执行监控检查
        function checkFund() {
            const fundCode = document.getElementById('checkFundCode').value.trim();
            
            if (!fundCode) {
                showMessage('checkResult', '请填写基金代码', false);
                return;
            }
            
            const params = new URLSearchParams({
                fundCode: fundCode
            });
            
            fetch(`${API_BASE}/check?${params}`, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showMessage('checkResult', data.message, true);
                } else {
                    showMessage('checkResult', data.message, false);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showMessage('checkResult', '检查失败: ' + error.message, false);
            });
        }
        
        // 查询基金净值
        function queryFundNav() {
            const fundCode = document.getElementById('queryFundCode').value.trim();
            const days = document.getElementById('queryDays').value || 30;
            
            if (!fundCode) {
                showMessage('queryResult', '请填写基金代码', false);
                return;
            }
            
            const params = new URLSearchParams({
                fundCode: fundCode,
                days: days
            });
            
            fetch(`${API_BASE}/nav?${params}`)
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    renderNavTable(data.data);
                    showMessage('queryResult', `查询成功，共 ${data.count} 条记录`, true);
                } else {
                    showMessage('queryResult', data.message, false);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showMessage('queryResult', '查询失败: ' + error.message, false);
            });
        }
        
        // 渲染净值表格
        function renderNavTable(navData) {
            const container = document.getElementById('navTableContainer');
            
            if (!navData || navData.length === 0) {
                container.innerHTML = '<p>暂无数据</p>';
                return;
            }
            
            let tableHtml = `
                <table class="nav-table">
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>单位净值</th>
                            <th>日涨跌幅</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            navData.forEach(item => {
                const dailyReturn = item.dailyReturn !== null ? item.dailyReturn.toFixed(2) : '0.00';
                const returnClass = dailyReturn > 0 ? 'positive' : (dailyReturn < 0 ? 'negative' : '');
                
                tableHtml += `
                    <tr>
                        <td>${item.navDate}</td>
                        <td>${item.unitNav.toFixed(4)}</td>
                        <td class="${returnClass}">${dailyReturn}%</td>
                    </tr>
                `;
            });
            
            tableHtml += `
                    </tbody>
                </table>
            `;
            
            container.innerHTML = tableHtml;
        }
        
        // 添加监控基金
        function addMonitorFund() {
            const fundCode = document.getElementById('monitorFundCode').value.trim();
            const fundName = document.getElementById('monitorFundName').value.trim();
            
            if (!fundCode || !fundName) {
                showMessage('monitorResult', '请填写基金代码和基金名称', false);
                return;
            }
            
            const params = new URLSearchParams({
                fundCode: fundCode,
                fundName: fundName
            });
            
            fetch(`${API_BASE}/monitor-fund?${params}`, {
                method: 'POST'
                // 注意：URLSearchParams 会自动设置 Content-Type 为 application/x-www-form-urlencoded
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showMessage('monitorResult', data.message, true);
                    // 清空输入框
                    document.getElementById('monitorFundCode').value = '';
                    document.getElementById('monitorFundName').value = '';
                    // 重新加载监控基金列表
                    loadMonitorFunds();
                } else {
                    showMessage('monitorResult', data.message, false);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showMessage('monitorResult', '添加失败: ' + error.message, false);
            });
        }
        
        // 加载监控基金列表
        function loadMonitorFunds() {
            fetch(`${API_BASE}/monitor-funds-with-nav`)
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    renderMonitorFundsTable(data.data);
                } else {
                    console.error('加载监控基金列表失败:', data.message);
                    document.getElementById('monitorFundsTableContainer').innerHTML = '<p>加载失败: ' + data.message + '</p>';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('monitorFundsTableContainer').innerHTML = '<p>加载失败: ' + error.message + '</p>';
            });
        }
        
        // 渲染监控基金表格
        function renderMonitorFundsTable(funds) {
            const container = document.getElementById('monitorFundsTableContainer');
            
            if (!funds || funds.length === 0) {
                container.innerHTML = '<p>暂无监控基金</p>';
                return;
            }
            
            let tableHtml = `
                <table class="nav-table">
                    <thead>
                        <tr>
                            <th>基金代码</th>
                            <th>基金名称</th>
                            <th>状态</th>
                            <th>最新净值</th>
                            <th>最新涨跌幅</th>
                            <th>净值日期</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            funds.forEach(fund => {
                const isEnabled = fund.enabled;
                const statusText = isEnabled ? '启用' : '禁用';
                const statusClass = isEnabled ? 'positive' : 'negative';
                
                const latestNav = fund.latestNav !== null ? fund.latestNav.toFixed(4) : '--';
                const latestReturn = fund.latestReturn !== null ? fund.latestReturn.toFixed(2) : '--';
                const returnClass = latestReturn !== '--' && parseFloat(latestReturn) > 0 ? 'positive' : 
                                  (latestReturn !== '--' && parseFloat(latestReturn) < 0 ? 'negative' : '');
                
                const navDate = fund.navDate || '--';
                
                tableHtml += `
                    <tr>
                        <td>${fund.fundCode}</td>
                        <td>${fund.fundName}</td>
                        <td class="${statusClass}">${statusText}</td>
                        <td>${latestNav}</td>
                        <td class="${returnClass}">${latestReturn}%</td>
                        <td>${navDate}</td>
                        <td>
                            <button class="btn btn-info" onclick="toggleFundStatus(${fund.id}, ${!isEnabled})">
                                ${isEnabled ? '禁用' : '启用'}
                            </button>
                            <button class="btn btn-danger" onclick="deleteMonitorFund(${fund.id})">删除</button>
                        </td>
                    </tr>
                `;
            });
            
            tableHtml += `
                    </tbody>
                </table>
            `;
            
            container.innerHTML = tableHtml;
        }
        
        // 切换基金状态
        function toggleFundStatus(fundId, enabled) {
            if (!confirm(`确定要${enabled ? '启用' : '禁用'}该基金吗？`)) {
                return;
            }
            
            const params = new URLSearchParams({
                enabled: enabled
            });
            
            fetch(`${API_BASE}/monitor-fund/${fundId}/status?${params}`, {
                method: 'PUT'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showMessage('monitorResult', data.message, true);
                    loadMonitorFunds(); // 重新加载列表
                } else {
                    showMessage('monitorResult', data.message, false);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showMessage('monitorResult', '操作失败: ' + error.message, false);
            });
        }
        
        // 删除监控基金
        function deleteMonitorFund(fundId) {
            if (!confirm('确定要删除该基金吗？')) {
                return;
            }
            
            fetch(`${API_BASE}/monitor-fund/${fundId}`, {
                method: 'DELETE'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showMessage('monitorResult', data.message, true);
                    loadMonitorFunds(); // 重新加载列表
                } else {
                    showMessage('monitorResult', data.message, false);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showMessage('monitorResult', '删除失败: ' + error.message, false);
            });
        }
    </script>
    
    <!-- 引入公共footer -->
    <div id="footer-placeholder"></div>
    
    <!-- 引入公共认证脚本 -->
    <script src="js/auth.js"></script>
</body>
</html>
