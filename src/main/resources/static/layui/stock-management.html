        .layui-card {

            margin: 0;

        .layui-table th {

        .footer {

<body>

        <!-- 头部区域 -->
        <div class="layui-header">
            <div class="layui-logo">📈 基金监控系统</div>
            <!-- 头部区域左侧 -->
            <ul class="layui-nav layui-layout-left">
                <li class="layui-nav-item"><a href="index.html">首页</a></li>
            </ul>
            <!-- 头部区域右侧 -->
            <ul class="layui-nav layui-layout-right" id="userInfoNav">
                <li class="layui-nav-item">
                    <a href="javascript:;" id="userNameLink">
                        <img src="//tva1.sinaimg.cn/crop.0.0.118.118.180/5db11ff4gw1e77d3nqrv8j203k03kweg.jpg" class="layui-nav-img">
                        <span id="currentUserName">游客</span>
                    </a>
                    <dl class="layui-nav-child">
                        <dd><a href="javascript:void(0);" onclick="logout()">退出登录</a></dd>
                    </dl>
                </li>
            </ul>
        </div>

        <!-- 左侧导航区域 -->
        <div class="layui-side layui-bg-black">
            <div class="layui-side-scroll">
                <!-- 左侧导航区域 -->
                <ul class="layui-nav layui-nav-tree" lay-filter="navTree">
                    <li class="layui-nav-item">
                        <a href="index.html">首页</a>
                    </li>
                    <li class="layui-nav-item">
                        <a href="javascript:;">基金监控</a>
                        <dl class="layui-nav-child">
                            <dd><a href="fund-monitor.html">📊 基金监控</a></dd>
                            <dd><a href="index-data.html">💹 指数数据</a></dd>
                            <dd><a href="fund-backtest.html">🧪 基金回测</a></dd>
                        </dl>
                    </li>
                    <li class="layui-nav-item">
                        <a href="javascript:;">告警管理</a>
                        <dl class="layui-nav-child">
                            <dd><a href="alert-records.html">🔔 告警记录</a></dd>
                            <dd><a href="notification-test.html">📧 通知测试</a></dd>
                        </dl>
                    </li>
                    <li class="layui-nav-item">
                        <a href="javascript:;">系统管理</a>
                        <dl class="layui-nav-child">
                            <dd><a href="email-recipient-management.html">👥 邮件接收人</a></dd>
                            <dd><a href="system-config.html">⚙️ 系统配置</a></dd>
                        </dl>
                    </li>
                    <li class="layui-nav-item">
                        <a href="javascript:;">AI功能</a>
                        <dl class="layui-nav-child">
                            <dd><a href="ai-test.html">🤖 AI测试</a></dd>
                            <dd><a href="fund-report-test.html">📈 报告测试</a></dd>
                        </dl>
                    </li>
                    <li class="layui-nav-item layui-nav-itemed">
                        <a href="stock-management.html">📈 股票管理</a>
                    </li>
                </ul>
            </div>
        </div>

        <!-- 内容主体区域 -->
        <div class="layui-body">
            <!-- 内容区 -->
            <div style="padding: 15px;">
                <div class="layui-card">
                    <div class="layui-card-header">
                        <i class="layui-icon layui-icon-dollar"></i> 股票管理
                        <button class="layui-btn layui-btn-sm layui-btn-normal" style="float: right;" onclick="refreshData()">
                            <i class="layui-icon layui-icon-refresh"></i> 刷新数据
                        </button>
                    </div>
                    <div class="layui-card-body">
                        <form class="layui-form" lay-filter="searchForm">
                            <div class="layui-form-item">
                                <div class="layui-inline">
                                    <label class="layui-form-label">股票代码</label>
                                    <div class="layui-input-inline">
                                        <input type="text" name="stockCode" placeholder="请输入股票代码" autocomplete="off" class="layui-input">
                                    </div>
                                </div>
                                <div class="layui-inline">
                                    <label class="layui-form-label">股票名称</label>
                                    <div class="layui-input-inline">
                                        <input type="text" name="stockName" placeholder="请输入股票名称" autocomplete="off" class="layui-input">
                                    </div>
                                </div>
                                <div class="layui-inline">
                                    <button class="layui-btn" lay-submit lay-filter="searchSubmit">
                                        <i class="layui-icon layui-icon-search"></i> 查询
                                    </button>
                                    <button type="reset" class="layui-btn layui-btn-primary">
                                        <i class="layui-icon layui-icon-refresh"></i> 重置
                                    </button>
                                </div>
                            </div>
                        </form>
                        
                        <table class="layui-hide" id="stockTable" lay-filter="stockTable"></table>
                    </div>
                </div>
                
                <!-- 操作按钮 -->
                <div class="layui-card" style="margin-top: 20px;">
                    <div class="layui-card-header">
                        <i class="layui-icon layui-icon-util"></i> 操作面板
                    </div>
                    <div class="layui-card-body">
                        <div class="layui-row layui-col-space15">
                            <div class="layui-col-md3">
                                <button class="layui-btn layui-btn-fluid" onclick="addStock()">
                                    <i class="layui-icon layui-icon-add-1"></i> 添加股票
                                </button>
                            </div>
                            <div class="layui-col-md3">
                                <button class="layui-btn layui-btn-warm layui-btn-fluid" onclick="batchSync()">
                                    <i class="layui-icon layui-icon-refresh"></i> 批量同步
                                </button>
                            </div>
                            <div class="layui-col-md3">
                                <button class="layui-btn layui-btn-danger layui-btn-fluid" onclick="batchDelete()">
                                    <i class="layui-icon layui-icon-delete"></i> 批量删除
                                </button>
                            </div>
                            <div class="layui-col-md3">
                                <button class="layui-btn layui-btn-normal layui-btn-fluid" onclick="exportData()">
                                    <i class="layui-icon layui-icon-export"></i> 导出数据
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部固定区域 -->
        <div class="layui-footer footer">
            © 2025 基金监控系统 - 专业的基金数据分析平台
        </div>
    </div>

    <script type="text/html" id="stockToolbar">
        <div class="layui-btn-container">
            <button class="layui-btn layui-btn-sm" lay-event="add">添加</button>
            <button class="layui-btn layui-btn-sm layui-btn-danger" lay-event="delete">删除</button>
        </div>
    </script>

    <script type="text/html" id="stockBar">
        <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
        <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
        <a class="layui-btn layui-btn-primary layui-btn-xs" lay-event="sync">同步</a>
    </script>

    <script src="https://cdn.jsdelivr.net/npm/layui@2.8.18/dist/layui.js"></script>
    <script>
        // API基础路径
        const STOCK_API_BASE = '/api/stocks';
        const USER_API_BASE = '/api/users';

        // 初始化Layui组件
        layui.use(['element', 'table', 'form', 'layer'], function(){
            var element = layui.element;
            var table = layui.table;
            var form = layui.form;
            var layer = layui.layer;

            // 页面加载时检查登录状态
            checkLoginStatus();
            
            // 初始化股票表格
            initStockTable();

            // 监听搜索提交
            form.on('submit(searchSubmit)', function(data){
                reloadStockTable(data.field);
                return false;
            });
        });

        // 检查登录状态
        async function checkLoginStatus() {
            try {
                const response = await fetch(`${USER_API_BASE}/status`);
                const result = await response.json();

                if (result.success) {
                    // 显示用户信息
                    document.getElementById('currentUserName').textContent = result.data.username;
                } else {
                    // 未登录，跳转到登录页面
                    window.location.href = 'login.html';
                }
            } catch (error) {
                console.error('检查登录状态失败:', error);
                // 跳转到登录页面
                window.location.href = 'login.html';
            }
        }

        // 用户登出
        async function logout() {
            try {
                const response = await fetch(`${USER_API_BASE}/logout`, {
                    method: 'POST'
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    // 登出成功，跳转到登录页面
                    window.location.href = 'login.html';
                } else {
                    alert('登出失败: ' + result.message);
                }
            } catch (error) {
                alert('登出失败: ' + error.message);
            }
        }

        // 初始化股票表格
        function initStockTable() {
            // 使用真实API获取数据
            loadStockData().then(data => {
                layui.table.render({
                    elem: '#stockTable',
                    data: data,
                    toolbar: '#stockToolbar',
                    cols: [[
                        {type: 'checkbox', fixed: 'left'},
                        {field: 'stockCode', title: '股票代码', width: 120, sort: true},
                        {field: 'stockName', title: '股票名称', minWidth: 150},
                        {field: 'currentPrice', title: '当前价格', width: 120, sort: true, templet: function(d) {
                            if (d.currentPrice === null) return '--';
                            return `<span class="${d.changePercent >= 0 ? 'positive' : 'negative'}">${d.currentPrice}</span>`;
                        }},
                        {field: 'changeAmount', title: '涨跌额', width: 120, sort: true, templet: function(d) {
                            if (d.changeAmount === null) return '--';
                            return `<span class="${d.changePercent >= 0 ? 'positive' : 'negative'}">${d.changeAmount}</span>`;
                        }},
                        {field: 'changePercent', title: '涨跌幅', width: 120, sort: true, templet: function(d) {
                            if (d.changePercent === null) return '--';
                            return `<span class="${d.changePercent >= 0 ? 'positive' : 'negative'}">${d.changePercent.toFixed(2)}%</span>`;
                        }},
                        {field: 'market', title: '市场', width: 100},
                        {field: 'lastSyncTime', title: '最后同步时间', width: 160, sort: true, templet: function(d) {
                            return d.lastSyncTime ? new Date(d.lastSyncTime).toLocaleString('zh-CN') : '--';
                        }},
                        {fixed: 'right', title: '操作', toolbar: '#stockBar', width: 150}
                    ]],
                    page: true,
                    limit: 10,
                    limits: [10, 20, 30, 50]
                });
            }).catch(error => {
                console.error('加载股票数据失败:', error);
                layer.msg('加载数据失败: ' + error.message, {icon: 2});
            });
        }

        // 加载股票数据
        async function loadStockData() {
            try {
                // 这里需要根据实际API调整，暂时使用模拟数据
                // 实际应该调用股票相关的API接口
                const response = await fetch('/api/stocks'); // 需要根据实际API调整
                const result = await response.json();
                
                if (result.success) {
                    return result.data || [];
                } else {
                    throw new Error(result.message || '获取数据失败');
                }
            } catch (error) {
                // 出错时使用模拟数据以便页面能正常显示
                console.warn('加载真实数据失败，使用模拟数据:', error);
                return [
                    {stockCode: '000001', stockName: '平安银行', currentPrice: '12.34', changeAmount: '0.45', changePercent: '3.78', market: 'SZ', lastSyncTime: '2025-12-10T10:30:00'},
                    {stockCode: '600000', stockName: '浦发银行', currentPrice: '8.92', changeAmount: '-0.23', changePercent: '-2.51', market: 'SH', lastSyncTime: '2025-12-10T10:30:00'},
                    {stockCode: '000858', stockName: '五粮液', currentPrice: '156.78', changeAmount: '5.67', changePercent: '3.75', market: 'SZ', lastSyncTime: '2025-12-10T10:30:00'}
                ];
            }
        }

        // 重新加载股票表格
        function reloadStockTable(params) {
            // 模拟重新加载数据
            console.log('搜索参数:', params);
            layer.msg('查询功能开发中...', {icon: 1});
        }

        // 刷新数据
        function refreshData() {
            layui.table.reload('stockTable');
            layer.msg('数据已刷新', {icon: 1});
        }

        // 添加股票
        function addStock() {
            layer.msg('添加股票功能开发中...', {icon: 1});
        }

        // 批量同步
        function batchSync() {
            layer.msg('批量同步功能开发中...', {icon: 1});
        }

        // 批量删除
        function batchDelete() {
            layer.msg('批量删除功能开发中...', {icon: 1});
        }

        // 导出数据
        function exportData() {
            layer.msg('导出数据功能开发中...', {icon: 1});
        }
    </script>
</body>
</html>
