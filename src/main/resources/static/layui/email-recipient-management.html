<head>
    <meta charset="UTF-8">

    <title>邮件接收人管理 - 基金监控系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.8.18/dist/css/layui.css">
    <style>
        body {
            background-color: #f5f5f5;
        }
        .layui-layout-admin .layui-header {
            background-color: #23262E;
        }
        .layui-layout-admin .layui-side {
            background-color: #393D49;
        }
        .layui-layout-admin .layui-logo {
            color: #fff;
            font-weight: bold;
        }
        .layui-card {
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
            border-radius: 4px;
        }
        .layui-table {
            margin: 0;
        }
        .layui-table th {
            background-color: #f8f9fa;
        }
        .status-enabled {
            color: #009688;
            font-weight: bold;
        }
        .status-disabled {
            color: #FF5722;
            font-weight: bold;
        }
        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="layui-layout layui-layout-admin">
        <!-- 头部区域 -->
        <div class="layui-header">
            <div class="layui-logo">📈 基金监控系统</div>
            <!-- 头部区域左侧 -->
            <ul class="layui-nav layui-layout-left">
                <li class="layui-nav-item"><a href="index.html">首页</a></li>
            </ul>
            <!-- 头部区域右侧 -->
            <ul class="layui-nav layui-layout-right" id="userInfoNav">
                <li class="layui-nav-item">
                    <a href="javascript:;" id="userNameLink">
                        <img src="//tva1.sinaimg.cn/crop.0.0.118.118.180/5db11ff4gw1e77d3nqrv8j203k03kweg.jpg" class="layui-nav-img">
                        <span id="currentUserName">游客</span>
                    </a>
                    <dl class="layui-nav-child">
                        <dd><a href="javascript:void(0);" onclick="logout()">退出登录</a></dd>
                    </dl>
                </li>
            </ul>
        </div>

        <!-- 左侧导航区域 -->
        <div class="layui-side layui-bg-black">
            <div class="layui-side-scroll">
                <!-- 左侧导航区域 -->
                <ul class="layui-nav layui-nav-tree" lay-filter="navTree">
                    <li class="layui-nav-item">
                        <a href="index.html">首页</a>
                    </li>
                    <li class="layui-nav-item">
                        <a href="javascript:;">基金监控</a>
                        <dl class="layui-nav-child">
                            <dd><a href="fund-monitor.html">📊 基金监控</a></dd>
                            <dd><a href="index-data.html">💹 指数数据</a></dd>
                            <dd><a href="fund-backtest.html">🧪 基金回测</a></dd>
                        </dl>
                    </li>
                    <li class="layui-nav-item">
                        <a href="javascript:;">告警管理</a>
                        <dl class="layui-nav-child">
                            <dd><a href="alert-records.html">🔔 告警记录</a></dd>
                            <dd><a href="notification-test.html">📧 通知测试</a></dd>
                        </dl>
                    </li>
                    <li class="layui-nav-item layui-nav-itemed">
                        <a href="javascript:;">系统管理</a>
                        <dl class="layui-nav-child">
                            <dd><a href="email-recipient-management.html">👥 邮件接收人</a></dd>
                            <dd><a href="system-config.html">⚙️ 系统配置</a></dd>
                        </dl>
                    </li>
                    <li class="layui-nav-item">
                        <a href="javascript:;">AI功能</a>
                        <dl class="layui-nav-child">
                            <dd><a href="ai-test.html">🤖 AI测试</a></dd>
                            <dd><a href="fund-report-test.html">📈 报告测试</a></dd>
                        </dl>
                    </li>
                    <li class="layui-nav-item">
                        <a href="stock-management.html">📈 股票管理</a>
                    </li>
                </ul>
            </div>
        </div>

        <!-- 内容主体区域 -->
        <div class="layui-body">
            <!-- 内容区 -->
            <div style="padding: 15px;">
                <div class="layui-card">
                    <div class="layui-card-header">
                        <i class="layui-icon layui-icon-username"></i> 邮件接收人管理
                        <button class="layui-btn layui-btn-sm layui-btn-normal" style="float: right;" onclick="refreshData()">
                            <i class="layui-icon layui-icon-refresh"></i> 刷新数据
                        </button>
                    </div>
                    <div class="layui-card-body">
                        <form class="layui-form" lay-filter="searchForm">
                            <div class="layui-form-item">
                                <div class="layui-inline">
                                    <label class="layui-form-label">姓名</label>
                                    <div class="layui-input-inline">
                                        <input type="text" name="name" placeholder="请输入姓名" autocomplete="off" class="layui-input">
                                    </div>
                                </div>
                                <div class="layui-inline">
                                    <label class="layui-form-label">邮箱</label>
                                    <div class="layui-input-inline">
                                        <input type="text" name="email" placeholder="请输入邮箱" autocomplete="off" class="layui-input">
                                    </div>
                                </div>
                                <div class="layui-inline">
                                    <button class="layui-btn" lay-submit lay-filter="searchSubmit">
                                        <i class="layui-icon layui-icon-search"></i> 查询
                                    </button>
                                    <button type="reset" class="layui-btn layui-btn-primary">
                                        <i class="layui-icon layui-icon-refresh"></i> 重置
                                    </button>
                                </div>
                            </div>
                        </form>
                        
                        <table class="layui-hide" id="recipientTable" lay-filter="recipientTable"></table>
                    </div>
                </div>
                
                <!-- 操作按钮 -->
                <div class="layui-card" style="margin-top: 20px;">
                    <div class="layui-card-header">
                        <i class="layui-icon layui-icon-util"></i> 操作面板
                    </div>
                    <div class="layui-card-body">
                        <div class="layui-row layui-col-space15">
                            <div class="layui-col-md3">
                                <button class="layui-btn layui-btn-fluid" onclick="addRecipient()">
                                    <i class="layui-icon layui-icon-add-1"></i> 添加接收人
                                </button>
                            </div>
                            <div class="layui-col-md3">
                                <button class="layui-btn layui-btn-danger layui-btn-fluid" onclick="batchDelete()">
                                    <i class="layui-icon layui-icon-delete"></i> 批量删除
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部固定区域 -->
        <div class="layui-footer footer">
            © 2025 基金监控系统 - 专业的基金数据分析平台
        </div>
    </div>

    <script type="text/html" id="recipientToolbar">
        <div class="layui-btn-container">
            <button class="layui-btn layui-btn-sm" lay-event="add">添加</button>
            <button class="layui-btn layui-btn-sm layui-btn-danger" lay-event="delete">删除</button>
        </div>
    </script>

    <script type="text/html" id="recipientBar">
        <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
        <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
    </script>

    <script src="https://cdn.jsdelivr.net/npm/layui@2.8.18/dist/layui.js"></script>
    <script>
        // API基础路径
        const RECIPIENT_API_BASE = '/api/email-recipients';
        const USER_API_BASE = '/api/users';

        // 初始化Layui组件
        layui.use(['element', 'table', 'form', 'layer'], function(){
            var element = layui.element;
            var table = layui.table;
            var form = layui.form;
            var layer = layui.layer;

            // 页面加载时检查登录状态
            checkLoginStatus();
            
            // 初始化邮件接收人表格
            initRecipientTable();

            // 监听搜索提交
            form.on('submit(searchSubmit)', function(data){
                reloadRecipientTable(data.field);
                return false;
            });
        });

        // 检查登录状态
        async function checkLoginStatus() {
            try {
                const response = await fetch(`${USER_API_BASE}/status`);
                const result = await response.json();

                if (result.success) {
                    // 显示用户信息
                    document.getElementById('currentUserName').textContent = result.data.username;
                } else {
                    // 未登录，跳转到登录页面
                    window.location.href = 'login.html';
                }
            } catch (error) {
                console.error('检查登录状态失败:', error);
                // 跳转到登录页面
                window.location.href = 'login.html';
            }
        }

        // 用户登出
        async function logout() {
            try {
                const response = await fetch(`${USER_API_BASE}/logout`, {
                    method: 'POST'
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    // 登出成功，跳转到登录页面
                    window.location.href = 'login.html';
                } else {
                    alert('登出失败: ' + result.message);
                }
            } catch (error) {
                alert('登出失败: ' + error.message);
            }
        }

        // 初始化邮件接收人表格
        function initRecipientTable() {
            // 使用真实API获取数据
            loadRecipientData().then(data => {
                layui.table.render({
                    elem: '#recipientTable',
                    data: data,
                    toolbar: '#recipientToolbar',
                    cols: [[
                        {type: 'checkbox', fixed: 'left'},
                        {field: 'id', title: 'ID', width: 80, sort: true},
                        {field: 'name', title: '姓名', minWidth: 120},
                        {field: 'email', title: '邮箱', minWidth: 200},
                        {field: 'enabled', title: '状态', width: 100, templet: function(d) {
                            return d.enabled ? '<span class="status-enabled">启用</span>' : '<span class="status-disabled">禁用</span>';
                        }},
                        {field: 'createTime', title: '创建时间', width: 180, sort: true, templet: function(d) {
                            return d.createTime ? new Date(d.createTime).toLocaleString('zh-CN') : '';
                        }},
                        {fixed: 'right', title: '操作', toolbar: '#recipientBar', width: 150}
                    ]],
                    page: true,
                    limit: 10,
                    limits: [10, 20, 30, 50]
                });
            }).catch(error => {
                console.error('加载邮件接收人数据失败:', error);
                layer.msg('加载数据失败: ' + error.message, {icon: 2});
            });
        }

        // 加载邮件接收人数据
        async function loadRecipientData() {
            try {
                const response = await fetch(RECIPIENT_API_BASE);
                const result = await response.json();
                
                if (result.success) {
                    return result.data || [];
                } else {
                    throw new Error(result.message || '获取数据失败');
                }
            } catch (error) {
                throw error;
            }
        }

        // 重新加载邮件接收人表格
        function reloadRecipientTable(params) {
            // 这里简化处理，实际应该根据搜索条件过滤数据
            initRecipientTable();
        }

        // 刷新数据
        function refreshData() {
            initRecipientTable();
            layer.msg('数据已刷新', {icon: 1});
        }

        // 添加邮件接收人
        function addRecipient() {
            layer.open({
                type: 1,
                title: '添加邮件接收人',
                content: `
                    <div style="padding: 20px;">
                        <form class="layui-form" id="addRecipientForm">
                            <div class="layui-form-item">
                                <label class="layui-form-label">姓名</label>
                                <div class="layui-input-block">
                                    <input type="text" name="name" required lay-verify="required" placeholder="请输入姓名" autocomplete="off" class="layui-input">
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <label class="layui-form-label">邮箱</label>
                                <div class="layui-input-block">
                                    <input type="email" name="email" required lay-verify="required|email" placeholder="请输入邮箱" autocomplete="off" class="layui-input">
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <label class="layui-form-label">状态</label>
                                <div class="layui-input-block">
                                    <input type="radio" name="enabled" value="true" title="启用" checked>
                                    <input type="radio" name="enabled" value="false" title="禁用">
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-input-block">
                                    <button class="layui-btn" lay-submit lay-filter="addRecipientSubmit">立即提交</button>
                                    <button type="reset" class="layui-btn layui-btn-primary">重置</button>
                                </div>
                            </div>
                        </form>
                    </div>
                `,
                area: ['500px', '400px'],
                success: function(layero, index) {
                    layui.form.render();
                    layui.form.on('submit(addRecipientSubmit)', function(data) {
                        addRecipientSubmit(data.field, index);
                        return false;
                    });
                }
            });
        }

        // 添加邮件接收人提交
        async function addRecipientSubmit(data, index) {
            try {
                const response = await fetch(RECIPIENT_API_BASE, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: data.name,
                        email: data.email,
                        enabled: data.enabled === 'true'
                    })
                });

                const result = await response.json();

                if (result.success) {
                    layer.msg('添加成功', {icon: 1});
                    layer.close(index);
                    refreshData();
                } else {
                    layer.msg('添加失败: ' + result.message, {icon: 2});
                }
            } catch (error) {
                layer.msg('添加失败: ' + error.message, {icon: 2});
            }
        }

        // 批量删除
        function batchDelete() {
            var checkStatus = layui.table.checkStatus('recipientTable');
            var data = checkStatus.data;
            
            if (data.length === 0) {
                layer.msg('请至少选择一条记录', {icon: 0});
                return;
            }
            
            layer.confirm('确定要删除这 ' + data.length + ' 个邮件接收人吗？', {
                title: '提示'
            }, function(index) {
                // 执行删除操作
                var promises = data.map(item => {
                    return fetch(`${RECIPIENT_API_BASE}/${item.id}`, {
                        method: 'DELETE'
                    });
                });
                
                Promise.all(promises)
                    .then(responses => {
                        return Promise.all(responses.map(response => response.json()));
                    })
                    .then(results => {
                        var successCount = results.filter(result => result.success).length;
                        layer.msg(`成功删除 ${successCount} 个邮件接收人`, {icon: 1});
                        refreshData();
                    })
                    .catch(error => {
                        layer.msg('删除失败: ' + error.message, {icon: 2});
                    });
                    
                layer.close(index);
            });
        }

        // 监听工具栏事件
        layui.table.on('toolbar(recipientTable)', function(obj) {
            switch(obj.event) {
                case 'add':
                    addRecipient();
                    break;
                case 'delete':
                    batchDelete();
                    break;
            }
        });

        // 监听行工具栏事件
        layui.table.on('tool(recipientTable)', function(obj) {
            var data = obj.data;
            switch(obj.event) {
                case 'edit':
                    editRecipient(data);
                    break;
                case 'del':
                    deleteRecipient(data.id);
                    break;
            }
        });

        // 编辑邮件接收人
        function editRecipient(data) {
            layer.open({
                type: 1,
                title: '编辑邮件接收人',
                content: `
                    <div style="padding: 20px;">
                        <form class="layui-form" id="editRecipientForm">
                            <input type="hidden" name="id" value="${data.id}">
                            <div class="layui-form-item">
                                <label class="layui-form-label">姓名</label>
                                <div class="layui-input-block">
                                    <input type="text" name="name" required lay-verify="required" placeholder="请输入姓名" autocomplete="off" class="layui-input" value="${data.name}">
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <label class="layui-form-label">邮箱</label>
                                <div class="layui-input-block">
                                    <input type="email" name="email" required lay-verify="required|email" placeholder="请输入邮箱" autocomplete="off" class="layui-input" value="${data.email}">
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <label class="layui-form-label">状态</label>
                                <div class="layui-input-block">
                                    <input type="radio" name="enabled" value="true" title="启用" ${data.enabled ? 'checked' : ''}>
                                    <input type="radio" name="enabled" value="false" title="禁用" ${!data.enabled ? 'checked' : ''}>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-input-block">
                                    <button class="layui-btn" lay-submit lay-filter="editRecipientSubmit">立即提交</button>
                                    <button type="reset" class="layui-btn layui-btn-primary">重置</button>
                                </div>
                            </div>
                        </form>
                    </div>
                `,
                area: ['500px', '400px'],
                success: function(layero, index) {
                    layui.form.render();
                    layui.form.on('submit(editRecipientSubmit)', function(formdata) {
                        editRecipientSubmit(formdata.field, index);
                        return false;
                    });
                }
            });
        }

        // 编辑邮件接收人提交
        async function editRecipientSubmit(data, index) {
            try {
                const response = await fetch(RECIPIENT_API_BASE, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        id: parseInt(data.id),
                        name: data.name,
                        email: data.email,
                        enabled: data.enabled === 'true'
                    })
                });

                const result = await response.json();

                if (result.success) {
                    layer.msg('更新成功', {icon: 1});
                    layer.close(index);
                    refreshData();
                } else {
                    layer.msg('更新失败: ' + result.message, {icon: 2});
                }
            } catch (error) {
                layer.msg('更新失败: ' + error.message, {icon: 2});
            }
        }

        // 删除邮件接收人
        function deleteRecipient(id) {
            layer.confirm('确定要删除这个邮件接收人吗？', {
                title: '提示'
            }, function(index) {
                fetch(`${RECIPIENT_API_BASE}/${id}`, {
                    method: 'DELETE'
                })
                .then(response => response.json())
                .then(result => {
                    if (result.success) {
                        layer.msg('删除成功', {icon: 1});
                        refreshData();
                    } else {
                        layer.msg('删除失败: ' + result.message, {icon: 2});
                    }
                })
                .catch(error => {
                    layer.msg('删除失败: ' + error.message, {icon: 2});
                });
                
                layer.close(index);
            });
        }
    </script>
</body>
</html>
