<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录 - 基金监控系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.8.18/dist/css/layui.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            transform: translateY(0);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .login-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
        }
        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .login-header::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
            transform: rotate(30deg);
        }
        .login-header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            position: relative;
            font-weight: 600;
        }
        .login-header p {
            font-size: 16px;
            opacity: 0.9;
            position: relative;
        }
        .login-body {
            padding: 30px;
        }
        .layui-form-item {
            margin-bottom: 25px;
            position: relative;
        }
        .layui-form-label {
            font-weight: 500;
            color: #333;
            padding: 0;
            margin-bottom: 8px;
        }
        .layui-input {
            height: 48px;
            border-radius: 6px;
            border: 2px solid #e6e6e6;
            padding-left: 40px;
            transition: all 0.3s ease;
            font-size: 15px;
        }
        .layui-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .input-icon {
            position: absolute;
            left: 12px;
            top: 38px;
            color: #999;
            font-size: 18px;
            z-index: 1;
        }
        .layui-btn {
            height: 48px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 16px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }
        .layui-btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        .layui-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        .result-message {
            margin-top: 15px;
            padding: 12px 15px;
            border-radius: 6px;
            text-align: center;
            display: none;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-message.success {
            background-color: #f0f9eb;
            color: #67c23a;
            border: 1px solid #e1f3d8;
        }
        .result-message.error {
            background-color: #fef0f0;
            color: #f56c6c;
            border: 1px solid #fde2e2;
        }
        /* 设备检测提示 */
        .device-detection {
            text-align: center;
            padding: 20px;
            color: white;
        }
        /* 底部信息 */
        .login-footer {
            text-align: center;
            margin-top: 25px;
            color: #999;
            font-size: 13px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .login-footer a {
            color: #667eea;
            text-decoration: none;
        }
        .login-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="device-detection" id="deviceDetection">
        <p>正在检测您的设备类型...</p>
    </div>

    <div class="login-container" id="loginContainer" style="display: none;">
        <div class="login-header">
            <h1>🔐 基金监控系统</h1>
            <p>专业的基金数据分析平台</p>
        </div>
        
        <div class="login-body">
            <form class="layui-form" id="loginForm" lay-filter="loginForm">
                <div class="layui-form-item">
                    <label class="layui-form-label">用户名</label>
                    <div class="input-icon">👤</div>
                    <div class="layui-input-block">
                        <input type="text" name="username" required lay-verify="required" placeholder="请输入用户名" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">密码</label>
                    <div class="input-icon">🔒</div>
                    <div class="layui-input-block">
                        <input type="password" name="password" required lay-verify="required" placeholder="请输入密码" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-input-block">
                        <button class="layui-btn layui-btn-primary layui-btn-fluid" lay-submit lay-filter="loginSubmit">安全登录</button>
                    </div>
                </div>
            </form>
            
            <div class="result-message" id="loginResult"></div>
            
            <div class="login-footer">
                <p>默认账户: admin / admin123</p>
                <p>或者: user / user123</p>
                <p style="margin-top: 15px; font-size: 12px; color: #bbb;">
                    © 2025 基金监控系统 v1.0
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/layui@2.8.18/dist/layui.js"></script>
    <script>
        // API基础路径
        const API_BASE = '/api/users';
        
        // 设备检测函数
        function isMobileDevice() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        }
        
        // 页面加载完成后检查设备类型和登录状态
        document.addEventListener('DOMContentLoaded', function() {
            // 检测设备类型
            if (isMobileDevice()) {
                // 移动设备，重定向到移动端登录页面
                window.location.href = '../mobile/login.html';
                return;
            }
            
            // PC设备，显示登录表单
            document.getElementById('deviceDetection').style.display = 'none';
            document.getElementById('loginContainer').style.display = 'block';
            
            // 添加输入框焦点效果
            const inputs = document.querySelectorAll('.layui-input');
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentElement.parentElement.querySelector('.input-icon').style.color = '#667eea';
                });
                input.addEventListener('blur', function() {
                    this.parentElement.parentElement.querySelector('.input-icon').style.color = '#999';
                });
            });
            
            // 初始化Layui表单
            layui.use('form', function(){
                var form = layui.form;
                
                // 监听提交
                form.on('submit(loginSubmit)', function(data){
                    handleLogin(data.field);
                    return false; // 阻止表单跳转
                });
            });
        });

        // 检查登录状态
        async function checkLoginStatus() {
            try {
                const response = await fetch(`${API_BASE}/status`);
                const result = await response.json();
                
                if (result.success) {
                    // 已登录，跳转到主页
                    window.location.href = 'index.html';
                }
            } catch (error) {
                console.log('检查登录状态失败:', error);
            }
        }

        // 处理登录
        async function handleLogin(data) {
            const username = data.username;
            const password = data.password;
            
            if (!username || !password) {
                showResult('loginResult', false, '请填写用户名和密码');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });
                
                const result = await response.json();
                
                if (response.ok && result.success) {
                    showResult('loginResult', true, '登录成功，正在跳转...');
                    // 延迟跳转到主页
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    showResult('loginResult', false, result.message || '登录失败');
                }
            } catch (error) {
                showResult('loginResult', false, '登录失败: ' + error.message);
            }
        }

        // 显示结果
        function showResult(elementId, isSuccess, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.className = 'result-message ' + (isSuccess ? 'success' : 'error');
            element.style.display = 'block';
            
            // 3秒后自动隐藏
            setTimeout(() => {
                element.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
