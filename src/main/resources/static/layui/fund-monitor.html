<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基金监控 - 基金监控系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.8.18/dist/css/layui.css">
    <style>
        body {
            background-color: #f5f5f5;
        }
        .layui-layout-admin .layui-header {
            background-color: #23262E;
        }
        .layui-layout-admin .layui-side {
            background-color: #393D49;
        }
        .layui-layout-admin .layui-logo {
            color: #fff;
            font-weight: bold;
        }
        .layui-card {
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
            border-radius: 4px;
        }
        .layui-table {
            margin: 0;
        }
        .layui-table th {
            background-color: #f8f9fa;
        }
        .positive {
            color: #FF5722;
            font-weight: bold;
        }
        .negative {
            color: #009688;
            font-weight: bold;
        }
        .quick-link {
            display: block;
            padding: 15px;
            text-align: center;
            background: #f8f9fa;
            border-radius: 4px;
            margin-bottom: 15px;
            transition: all 0.3s;
            text-decoration: none;
            color: #333;
        }
        .quick-link:hover {
            background: #e9ecef;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .quick-link i {
            font-size: 24px;
            margin-bottom: 10px;
            display: block;
        }
        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="layui-layout layui-layout-admin">
        <!-- 头部区域 -->
        <div class="layui-header">
            <div class="layui-logo">📈 基金监控系统</div>
            <!-- 头部区域左侧 -->
            <ul class="layui-nav layui-layout-left">
                <li class="layui-nav-item"><a href="index.html">首页</a></li>
            </ul>
            <!-- 头部区域右侧 -->
            <ul class="layui-nav layui-layout-right" id="userInfoNav">
                <li class="layui-nav-item">
                    <a href="javascript:;" id="userNameLink">
                        <img src="//tva1.sinaimg.cn/crop.0.0.118.118.180/5db11ff4gw1e77d3nqrv8j203k03kweg.jpg" class="layui-nav-img">
                        <span id="currentUserName">游客</span>
                    </a>
                    <dl class="layui-nav-child">
                        <dd><a href="javascript:void(0);" onclick="logout()">退出登录</a></dd>
                    </dl>
                </li>
            </ul>
        </div>

        <!-- 左侧导航区域 -->
        <div class="layui-side layui-bg-black">
            <div class="layui-side-scroll">
                <!-- 左侧导航区域 -->
                <ul class="layui-nav layui-nav-tree" lay-filter="navTree">
                    <li class="layui-nav-item">
                        <a href="index.html">首页</a>
                    </li>
                    <li class="layui-nav-item layui-nav-itemed">
                        <a href="javascript:;">基金监控</a>
                        <dl class="layui-nav-child">
                            <dd><a href="fund-monitor.html">📊 基金监控</a></dd>
                            <dd><a href="index-data.html">💹 指数数据</a></dd>
                            <dd><a href="fund-backtest.html">🧪 基金回测</a></dd>
                        </dl>
                    </li>
                    <li class="layui-nav-item">
                        <a href="javascript:;">告警管理</a>
                        <dl class="layui-nav-child">
                            <dd><a href="alert-records.html">🔔 告警记录</a></dd>
                            <dd><a href="notification-test.html">📧 通知测试</a></dd>
                        </dl>
                    </li>
                    <li class="layui-nav-item">
                        <a href="javascript:;">系统管理</a>
                        <dl class="layui-nav-child">
                            <dd><a href="email-recipient-management.html">👥 邮件接收人</a></dd>
                            <dd><a href="system-config.html">⚙️ 系统配置</a></dd>
                        </dl>
                    </li>
                    <li class="layui-nav-item">
                        <a href="javascript:;">AI功能</a>
                        <dl class="layui-nav-child">
                            <dd><a href="ai-test.html">🤖 AI测试</a></dd>
                            <dd><a href="fund-report-test.html">📈 报告测试</a></dd>
                        </dl>
                    </li>
                    <li class="layui-nav-item">
                        <a href="stock-management.html">📈 股票管理</a>
                    </li>
                </ul>
            </div>
        </div>

        <!-- 内容主体区域 -->
        <div class="layui-body">
            <!-- 内容区 -->
            <div style="padding: 15px;">
                <div class="layui-card">
                    <div class="layui-card-header">
                        <i class="layui-icon layui-icon-chart"></i> 基金监控
                        <button class="layui-btn layui-btn-sm layui-btn-normal" style="float: right;" onclick="refreshData()">
                            <i class="layui-icon layui-icon-refresh"></i> 刷新数据
                        </button>
                    </div>
                    <div class="layui-card-body">
                        <form class="layui-form" lay-filter="searchForm">
                            <div class="layui-form-item">
                                <div class="layui-inline">
                                    <label class="layui-form-label">基金代码</label>
                                    <div class="layui-input-inline">
                                        <input type="text" name="fundCode" placeholder="请输入基金代码" autocomplete="off" class="layui-input">
                                    </div>
                                </div>
                                <div class="layui-inline">
                                    <label class="layui-form-label">基金名称</label>
                                    <div class="layui-input-inline">
                                        <input type="text" name="fundName" placeholder="请输入基金名称" autocomplete="off" class="layui-input">
                                    </div>
                                </div>
                                <div class="layui-inline">
                                    <button class="layui-btn" lay-submit lay-filter="searchSubmit">
                                        <i class="layui-icon layui-icon-search"></i> 查询
                                    </button>
                                    <button type="reset" class="layui-btn layui-btn-primary">
                                        <i class="layui-icon layui-icon-refresh"></i> 重置
                                    </button>
                                </div>
                            </div>
                        </form>
                        
                        <table class="layui-hide" id="fundTable" lay-filter="fundTable"></table>
                    </div>
                </div>
                
                <!-- 操作按钮 -->
                <div class="layui-card" style="margin-top: 20px;">
                    <div class="layui-card-header">
                        <i class="layui-icon layui-icon-util"></i> 操作面板
                    </div>
                    <div class="layui-card-body">
                        <div class="layui-row layui-col-space15">
                            <div class="layui-col-md3">
                                <button class="layui-btn layui-btn-fluid" onclick="addFund()">
                                    <i class="layui-icon layui-icon-add-1"></i> 添加监控基金
                                </button>
                            </div>
                            <div class="layui-col-md3">
                                <button class="layui-btn layui-btn-warm layui-btn-fluid" onclick="batchCheck()">
                                    <i class="layui-icon layui-icon-ok"></i> 批量检查
                                </button>
                            </div>
                            <div class="layui-col-md3">
                                <button class="layui-btn layui-btn-danger layui-btn-fluid" onclick="batchDelete()">
                                    <i class="layui-icon layui-icon-delete"></i> 批量删除
                                </button>
                            </div>
                            <div class="layui-col-md3">
                                <button class="layui-btn layui-btn-normal layui-btn-fluid" onclick="exportData()">
                                    <i class="layui-icon layui-icon-export"></i> 导出数据
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部固定区域 -->
        <div class="layui-footer footer">
            © 2025 基金监控系统 - 专业的基金数据分析平台
        </div>
    </div>

    <script type="text/html" id="fundToolbar">
        <div class="layui-btn-container">
            <button class="layui-btn layui-btn-sm" lay-event="add">添加</button>
            <button class="layui-btn layui-btn-sm layui-btn-danger" lay-event="delete">删除</button>
        </div>
    </script>

    <script type="text/html" id="fundBar">
        <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
        <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
        <a class="layui-btn layui-btn-primary layui-btn-xs" lay-event="check">检查</a>
    </script>

    <script src="https://cdn.jsdelivr.net/npm/layui@2.8.18/dist/layui.js"></script>
    <script>
        // API基础路径
        const FUND_API_BASE = '/api/fund/monitor';
        const USER_API_BASE = '/api/users';

        // 初始化Layui组件
        layui.use(['element', 'table', 'form', 'layer'], function(){
            var element = layui.element;
            var table = layui.table;
            var form = layui.form;
            var layer = layui.layer;

            // 页面加载时检查登录状态
            checkLoginStatus();
            
            // 初始化基金表格
            initFundTable();

            // 监听搜索提交
            form.on('submit(searchSubmit)', function(data){
                reloadFundTable(data.field);
                return false;
            });
        });

        // 检查登录状态
        async function checkLoginStatus() {
            try {
                const response = await fetch(`${USER_API_BASE}/status`);
                const result = await response.json();

                if (result.success) {
                    // 显示用户信息
                    document.getElementById('currentUserName').textContent = result.data.username;
                } else {
                    // 未登录，跳转到登录页面
                    window.location.href = 'login.html';
                }
            } catch (error) {
                console.error('检查登录状态失败:', error);
                // 跳转到登录页面
                window.location.href = 'login.html';
            }
        }

        // 用户登出
        async function logout() {
            try {
                const response = await fetch(`${USER_API_BASE}/logout`, {
                    method: 'POST'
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    // 登出成功，跳转到登录页面
                    window.location.href = 'login.html';
                } else {
                    alert('登出失败: ' + result.message);
                }
            } catch (error) {
                alert('登出失败: ' + error.message);
            }
        }

        // 初始化基金表格
        function initFundTable() {
            // 使用真实API获取数据
            loadFundData().then(data => {
                layui.table.render({
                    elem: '#fundTable',
                    data: data,
                    toolbar: '#fundToolbar',
                    cols: [[
                        {type: 'checkbox', fixed: 'left'},
                        {field: 'fundCode', title: '基金代码', width: 120, sort: true},
                        {field: 'fundName', title: '基金名称', minWidth: 150},
                        {field: 'latestNav', title: '净值', width: 100, sort: true, templet: function(d) {
                            if (d.latestNav === null) return '--';
                            return `<span class="${d.latestReturn >= 0 ? 'positive' : 'negative'}">${d.latestNav.toFixed(4)}</span>`;
                        }},
                        {field: 'latestReturn', title: '涨跌幅', width: 100, sort: true, templet: function(d) {
                            if (d.latestReturn === null) return '--';
                            return `<span class="${d.latestReturn >= 0 ? 'positive' : 'negative'}">${d.latestReturn.toFixed(2)}%</span>`;
                        }},
                        {field: 'monitorRule', title: '监控规则', width: 120, templet: function(d) {
                            // 这里可以根据实际业务逻辑设置监控规则
                            return 'A'; // 默认规则
                        }},
                        {field: 'navDate', title: '净值日期', width: 160, sort: true, templet: function(d) {
                            return d.navDate || '--';
                        }},
                        {field: 'enabled', title: '状态', width: 100, templet: function(d) {
                            return d.enabled ? '<span style="color: #009688;">启用</span>' : '<span style="color: #FF5722;">停用</span>';
                        }},
                        {fixed: 'right', title: '操作', toolbar: '#fundBar', width: 150}
                    ]],
                    page: true,
                    limit: 10,
                    limits: [10, 20, 30, 50]
                });
            }).catch(error => {
                console.error('加载基金数据失败:', error);
                layer.msg('加载数据失败: ' + error.message, {icon: 2});
            });
        }

        // 加载基金数据
        async function loadFundData() {
            try {
                const response = await fetch(`${FUND_API_BASE}/monitor-funds-with-nav`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const result = await response.json();
                
                if (result.success) {
                    // 处理基金名称编码问题
                    const data = result.data || [];
                    return data.map(item => ({
                        ...item,
                        fundName: item.fundName ? decodeURIComponent(escape(item.fundName)) : item.fundName
                    }));
                } else {
                    console.warn('获取基金数据失败:', result.message || '未知错误');
                    return []; // 返回空数组而不是抛出错误
                }
            } catch (error) {
                console.error('加载基金数据失败:', error);
                return []; // 返回空数组而不是抛出错误
            }
        }

        // 根据参数加载基金数据
        async function loadFundDataWithParams(params) {
            try {
                // 先获取所有数据
                const response = await fetch(`${FUND_API_BASE}/monitor-funds-with-nav`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const result = await response.json();
                
                if (result.success) {
                    let data = result.data || [];
                    
                    // 根据搜索参数过滤数据
                    if (params) {
                        if (params.fundCode) {
                            data = data.filter(item => item.fundCode && item.fundCode.includes(params.fundCode));
                        }
                        if (params.fundName) {
                            data = data.filter(item => item.fundName && item.fundName.includes(params.fundName));
                        }
                    }
                    
                    return data;
                } else {
                    console.warn('获取基金数据失败:', result.message || '未知错误');
                    return [];
                }
            } catch (error) {
                console.error('加载基金数据失败:', error);
                return [];
            }
        }

        // 重新加载基金表格
        function reloadFundTable(params) {
            // 根据搜索参数重新加载数据
            loadFundDataWithParams(params).then(data => {
                layui.table.reload('fundTable', {
                    data: data
                });
            }).catch(error => {
                console.error('重新加载基金数据失败:', error);
                layer.msg('重新加载数据失败: ' + error.message, {icon: 2});
            });
        }

        // 刷新数据
        function refreshData() {
            initFundTable();
            layer.msg('数据已刷新', {icon: 1});
        }

        // 添加基金
        function addFund() {
            layer.open({
                type: 1,
                title: '添加监控基金',
                content: `
                    <div style="padding: 20px;">
                        <form class="layui-form" id="addFundForm">
                            <div class="layui-form-item">
                                <label class="layui-form-label">基金代码</label>
                                <div class="layui-input-block">
                                    <input type="text" name="fundCode" required lay-verify="required" placeholder="请输入基金代码" autocomplete="off" class="layui-input">
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <label class="layui-form-label">基金名称</label>
                                <div class="layui-input-block">
                                    <input type="text" name="fundName" required lay-verify="required" placeholder="请输入基金名称" autocomplete="off" class="layui-input">
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-input-block">
                                    <button class="layui-btn" lay-submit lay-filter="addFundSubmit">立即提交</button>
                                    <button type="reset" class="layui-btn layui-btn-primary">重置</button>
                                </div>
                            </div>
                        </form>
                    </div>
                `,
                area: ['500px', '300px'],
                success: function(layero, index) {
                    layui.form.render();
                    layui.form.on('submit(addFundSubmit)', function(data) {
                        addFundSubmit(data.field, index);
                        return false;
                    });
                }
            });
        }

        // 添加基金提交
        async function addFundSubmit(data, index) {
            try {
                const response = await fetch(`${FUND_API_BASE}/monitor-fund`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: new URLSearchParams({
                        fundCode: data.fundCode,
                        fundName: data.fundName
                    })
                });

                const result = await response.json();

                if (result.success) {
                    layer.msg('添加成功', {icon: 1});
                    layer.close(index);
                    refreshData();
                } else {
                    layer.msg('添加失败: ' + result.message, {icon: 2});
                }
            } catch (error) {
                layer.msg('添加失败: ' + error.message, {icon: 2});
            }
        }

        // 批量检查
        function batchCheck() {
            var checkStatus = layui.table.checkStatus('fundTable');
            var data = checkStatus.data;
            
            if (data.length === 0) {
                layer.msg('请至少选择一条记录', {icon: 0});
                return;
            }
            
            layer.msg('批量检查功能开发中...', {icon: 1});
        }

        // 批量删除
        function batchDelete() {
            var checkStatus = layui.table.checkStatus('fundTable');
            var data = checkStatus.data;
            
            if (data.length === 0) {
                layer.msg('请至少选择一条记录', {icon: 0});
                return;
            }
            
            layer.confirm('确定要删除这 ' + data.length + ' 个基金吗？', {
                title: '提示'
            }, function(index) {
                // 执行删除操作
                var promises = data.map(item => {
                    return fetch(`${FUND_API_BASE}/monitor-fund/${item.id}`, {
                        method: 'DELETE'
                    });
                });
                
                Promise.all(promises)
                    .then(responses => {
                        return Promise.all(responses.map(response => response.json()));
                    })
                    .then(results => {
                        var successCount = results.filter(result => result.success).length;
                        layer.msg(`成功删除 ${successCount} 个基金`, {icon: 1});
                        refreshData();
                    })
                    .catch(error => {
                        layer.msg('删除失败: ' + error.message, {icon: 2});
                    });
                    
                layer.close(index);
            });
        }

        // 导出数据
        function exportData() {
            layer.msg('导出数据功能开发中...', {icon: 1});
        }

        // 监听工具栏事件
        layui.table.on('toolbar(fundTable)', function(obj) {
            switch(obj.event) {
                case 'add':
                    addFund();
                    break;
                case 'delete':
                    batchDelete();
                    break;
            }
        });

        // 监听行工具栏事件
        layui.table.on('tool(fundTable)', function(obj) {
            var data = obj.data;
            switch(obj.event) {
                case 'edit':
                    editFund(data);
                    break;
                case 'del':
                    deleteFund(data.id);
                    break;
                case 'check':
                    checkFund(data.fundCode);
                    break;
            }
        });

        // 编辑基金
        function editFund(data) {
            layer.msg('编辑功能开发中...', {icon: 1});
        }

        // 删除基金
        function deleteFund(id) {
            layer.confirm('确定要删除这个基金吗？', {
                title: '提示'
            }, function(index) {
                fetch(`${FUND_API_BASE}/monitor-fund/${id}`, {
                    method: 'DELETE'
                })
                .then(response => response.json())
                .then(result => {
                    if (result.success) {
                        layer.msg('删除成功', {icon: 1});
                        refreshData();
                    } else {
                        layer.msg('删除失败: ' + result.message, {icon: 2});
                    }
                })
                .catch(error => {
                    layer.msg('删除失败: ' + error.message, {icon: 2});
                });
                
                layer.close(index);
            });
        }

        // 检查基金
        function checkFund(fundCode) {
            layer.msg('检查基金: ' + fundCode, {icon: 1});
        }
    </script>
</body>
</html>
