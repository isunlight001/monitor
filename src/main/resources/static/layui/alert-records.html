                    <a href="javascript:;" id="userNameLink">
                        <img src="//tva1.sinaimg.cn/crop.0.0.118.118.180/5db11ff4gw1e77d3nqrv8j203k03kweg.jpg" class="layui-nav-img">
                        <span id="currentUserName">游客</span>

        <!-- 左侧导航区域 -->
        <div class="layui-side layui-bg-black">
            <div class="layui-side-scroll">
                <!-- 左侧导航区域 -->
                <ul class="layui-nav layui-nav-tree" lay-filter="navTree">
                    <li class="layui-nav-item">
                        <a href="index.html">首页</a>
                    </li>
                    <li class="layui-nav-item">
                        <a href="javascript:;">基金监控</a>
                        <dl class="layui-nav-child">
                            <dd><a href="fund-monitor.html">📊 基金监控</a></dd>

                    <li class="layui-nav-item layui-nav-itemed">
                        <a href="javascript:;">告警管理</a>
                        <dl class="layui-nav-child">
                            <dd><a href="alert-records.html">🔔 告警记录</a></dd>

                        </dl>

                        <dl class="layui-nav-child">
                            <dd><a href="email-recipient-management.html">👥 邮件接收人</a></dd>

                        </dl>
                    </li>
                    <li class="layui-nav-item">
                        <a href="javascript:;">AI功能</a>
                        <dl class="layui-nav-child">
                            <dd><a href="ai-test.html">🤖 AI测试</a></dd>
                            <dd><a href="fund-report-test.html">📈 报告测试</a></dd>
                        </dl>

                    <li class="layui-nav-item">
                        <a href="stock-management.html">📈 股票管理</a>
                    </li>
                </ul>
            </div>
        </div>

        <!-- 内容主体区域 -->
        <div class="layui-body">
            <!-- 内容区 -->
            <div style="padding: 15px;">
                <div class="layui-card">
                    <div class="layui-card-header">
                        <i class="layui-icon layui-icon-bell"></i> 告警记录
                        <button class="layui-btn layui-btn-sm layui-btn-normal" style="float: right;" onclick="refreshData()">
                            <i class="layui-icon layui-icon-refresh"></i> 刷新数据
                        </button>
                    </div>
                    <div class="layui-card-body">
                        <form class="layui-form" lay-filter="searchForm">
                            <div class="layui-form-item">
                                <div class="layui-inline">
                                    <label class="layui-form-label">基金代码</label>
                                    <div class="layui-input-inline">
                                        <input type="text" name="fundCode" placeholder="请输入基金代码" autocomplete="off" class="layui-input">
                                    </div>
                                </div>
                                <div class="layui-inline">
                                    <label class="layui-form-label">基金名称</label>
                                    <div class="layui-input-inline">
                                        <input type="text" name="fundName" placeholder="请输入基金名称" autocomplete="off" class="layui-input">
                                    </div>
                                </div>
                                <div class="layui-inline">
                                    <label class="layui-form-label">告警级别</label>
                                    <div class="layui-input-inline">
                                        <select name="alertLevel">
                                            <option value="">请选择告警级别</option>
                                            <option value="HIGH">高风险</option>
                                            <option value="MEDIUM">中风险</option>

                                <div class="layui-inline">
                                    <label class="layui-form-label">时间范围</label>
                                    <div class="layui-input-inline">

                                    </div>
                                </div>
                                <div class="layui-inline">
                                    <button class="layui-btn" lay-submit lay-filter="searchSubmit">
                                        <i class="layui-icon layui-icon-search"></i> 查询
                                    </button>
                                    <button type="reset" class="layui-btn layui-btn-primary">
                                        <i class="layui-icon layui-icon-refresh"></i> 重置

                        <table class="layui-hide" id="alertTable" lay-filter="alertTable"></table>
                    </div>
                </div>
                
                <!-- 操作按钮 -->
                <div class="layui-card" style="margin-top: 20px;">
                    <div class="layui-card-header">
                        <i class="layui-icon layui-icon-util"></i> 操作面板
                    </div>

                        <div class="layui-row layui-col-space15">
                            <div class="layui-col-md3">
                                <button class="layui-btn layui-btn-danger layui-btn-fluid" onclick="clearAllAlerts()">
                                    <i class="layui-icon layui-icon-delete"></i> 清空所有告警
                                </button>
                            </div>
                            <div class="layui-col-md3">
                                <button class="layui-btn layui-btn-normal layui-btn-fluid" onclick="exportData()">

    <script type="text/html" id="alertToolbar">
        <div class="layui-btn-container">
            <button class="layui-btn layui-btn-sm layui-btn-danger" lay-event="clearAll">清空所有</button>
        </div>
    </script>

    <script type="text/html" id="alertBar">
        <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
    </script>

    <script src="https://cdn.jsdelivr.net/npm/layui@2.8.18/dist/layui.js"></script>
    <script>
        // API基础路径
        const ALERT_API_BASE = '/api/alert';
        const USER_API_BASE = '/api/users';

        // 初始化Layui组件
        layui.use(['element', 'table', 'form', 'layer', 'laydate'], function(){
            var element = layui.element;
            var table = layui.table;
            var form = layui.form;
            var layer = layui.layer;
            var laydate = layui.laydate;

            // 初始化日期选择器
            laydate.render({
                elem: '#dateRange',
                range: true,
                theme: '#448aff'
            });

            // 页面加载时检查登录状态
            checkLoginStatus();
            
            // 初始化告警表格
            initAlertTable();

            // 监听搜索提交
            form.on('submit(searchSubmit)', function(data){
                reloadAlertTable(data.field);
                return false;
            });
        });

        // 检查登录状态
        async function checkLoginStatus() {
            try {
                const response = await fetch(`${USER_API_BASE}/status`);
                const result = await response.json();

                if (result.success) {
                    // 显示用户信息
                    document.getElementById('currentUserName').textContent = result.data.username;
                } else {
                    // 未登录，跳转到登录页面
                    window.location.href = 'login.html';
                }
            } catch (error) {
                console.error('检查登录状态失败:', error);
                // 跳转到登录页面
                window.location.href = 'login.html';
            }
        }

        // 用户登出
        async function logout() {
            try {
                const response = await fetch(`${USER_API_BASE}/logout`, {
                    method: 'POST'
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    // 登出成功，跳转到登录页面
                    window.location.href = 'login.html';
                } else {
                    alert('登出失败: ' + result.message);
                }
            } catch (error) {
                alert('登出失败: ' + error.message);
            }
        }

        // 初始化告警表格
        function initAlertTable() {
            // 使用真实API获取数据
            loadAlertData().then(data => {
                layui.table.render({
                    elem: '#alertTable',
                    data: data,
                    toolbar: '#alertToolbar',
                    cols: [[
                        {type: 'checkbox', fixed: 'left'},
                        {field: 'fundCode', title: '基金代码', width: 120, sort: true},
                        {field: 'fundName', title: '基金名称', minWidth: 150},
                        {field: 'alertType', title: '告警类型', width: 120, templet: function(d) {
                            switch(d.alertType) {
                                case 'HIGH': return '<span class="alert-high">高风险</span>';
                                case 'MEDIUM': return '<span class="alert-medium">中风险</span>';
                                case 'LOW': return '<span class="alert-low">低风险</span>';
                                default: return d.alertType;
                            }
                        }},
                        {field: 'ruleDescription', title: '规则描述', minWidth: 200},
                        {field: 'alertContent', title: '告警内容', minWidth: 200},
                        {field: 'createTime', title: '告警时间', width: 180, sort: true, templet: function(d) {
                            return d.createTime ? new Date(d.createTime).toLocaleString('zh-CN') : '';
                        }},
                        {fixed: 'right', title: '操作', toolbar: '#alertBar', width: 80}
                    ]],
                    page: true,
                    limit: 10,
                    limits: [10, 20, 30, 50]
                });
            }).catch(error => {
                console.error('加载告警数据失败:', error);
                layer.msg('加载数据失败: ' + error.message, {icon: 2});
            });
        }

        // 加载告警数据
        async function loadAlertData() {
            try {
                // 使用正确的告警API端点
                const response = await fetch('/api/alert/records');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const result = await response.json();
                
                if (result.success) {
                    // 处理基金名称编码问题
                    const data = result.data || [];
                    return data.map(item => ({
                        ...item,
                        fundName: item.fundName ? decodeURIComponent(escape(item.fundName)) : item.fundName
                    }));
                } else {
                    console.warn('获取告警数据失败:', result.message || '未知错误');
                    return [];
                }
            } catch (error) {
                console.warn('加载告警数据失败:', error);
                return [];
            }
        }

        // 重新加载告警表格
        function reloadAlertTable(params) {
            // 模拟重新加载数据
            console.log('搜索参数:', params);
            layer.msg('查询功能开发中...', {icon: 1});
        }

        // 刷新数据
        function refreshData() {
            layui.table.reload('alertTable');
            layer.msg('数据已刷新', {icon: 1});
        }

        // 清空所有告警
        function clearAllAlerts() {
            layer.confirm('确定要清空所有告警记录吗？', {
                title: '提示',
                icon: 3
            }, function(index){
                layer.msg('清空功能开发中...', {icon: 1});
                layer.close(index);
            });
        }

        // 导出数据
        function exportData() {
            layer.msg('导出数据功能开发中...', {icon: 1});
        }
    </script>
</body>
</html>
