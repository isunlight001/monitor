        <!-- 左侧导航区域 -->

        <!-- 内容主体区域 -->
        <div class="layui-body">
            <!-- 内容区 -->
            <div style="padding: 15px;">
                <div class="layui-card">
                    <div class="layui-card-header">
                        <i class="layui-icon layui-icon-set"></i> 系统配置管理
                        <button class="layui-btn layui-btn-sm layui-btn-normal" style="float: right;" onclick="refreshData()">
                            <i class="layui-icon layui-icon-refresh"></i> 刷新数据
                        </button>

                        <table class="layui-hide" id="configTable" lay-filter="configTable"></table>

        <!-- 底部固定区域 -->

            © 2025 基金监控系统 - 专业的基金数据分析平台

    <script type="text/html" id="configBar">
        <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
    </script>

    <script src="https://cdn.jsdelivr.net/npm/layui@2.8.18/dist/layui.js"></script>
    <script>
        // API基础路径
        const CONFIG_API_BASE = '/api/system/config';
        const USER_API_BASE = '/api/users';

        // 初始化Layui组件
        layui.use(['element', 'table', 'form', 'layer'], function(){
            var element = layui.element;
            var table = layui.table;
            var form = layui.form;
            var layer = layui.layer;

            // 页面加载时检查登录状态
            checkLoginStatus();
            
            // 初始化系统配置表格
            initConfigTable();
        });

        // 检查登录状态
        async function checkLoginStatus() {
            try {
                const response = await fetch(`${USER_API_BASE}/status`);
                const result = await response.json();

                if (result.success) {
                    // 显示用户信息
                    document.getElementById('currentUserName').textContent = result.data.username;
                } else {
                    // 未登录，跳转到登录页面
                    window.location.href = 'login.html';
                }
            } catch (error) {
                console.error('检查登录状态失败:', error);
                // 跳转到登录页面
                window.location.href = 'login.html';
            }
        }

        // 用户登出
        async function logout() {
            try {
                const response = await fetch(`${USER_API_BASE}/logout`, {
                    method: 'POST'
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    // 登出成功，跳转到登录页面
                    window.location.href = 'login.html';
                } else {
                    alert('登出失败: ' + result.message);
                }
            } catch (error) {
                alert('登出失败: ' + error.message);
            }
        }

        // 初始化系统配置表格
        function initConfigTable() {
            // 使用真实API获取数据
            loadConfigData().then(data => {
                layui.table.render({
                    elem: '#configTable',
                    data: data,
                    cols: [[
                        {field: 'id', title: 'ID', width: 80, sort: true},
                        {field: 'configKey', title: '配置键', minWidth: 150},
                        {field: 'configValue', title: '配置值', minWidth: 150},
                        {field: 'description', title: '描述', minWidth: 200},
                        {field: 'enabled', title: '状态', width: 100, templet: function(d) {
                            return d.enabled ? '<span class="status-enabled">启用</span>' : '<span class="status-disabled">禁用</span>';
                        }},
                        {field: 'createTime', title: '创建时间', width: 180, sort: true, templet: function(d) {
                            return d.createTime ? new Date(d.createTime).toLocaleString('zh-CN') : '';
                        }},
                        {field: 'updateTime', title: '更新时间', width: 180, sort: true, templet: function(d) {
                            return d.updateTime ? new Date(d.updateTime).toLocaleString('zh-CN') : '';
                        }},
                        {fixed: 'right', title: '操作', toolbar: '#configBar', width: 80}
                    ]],
                    page: true,
                    limit: 10,
                    limits: [10, 20, 30, 50]
                });
            }).catch(error => {
                console.error('加载系统配置数据失败:', error);
                layer.msg('加载数据失败: ' + error.message, {icon: 2});
            });
        }

        // 加载系统配置数据
        async function loadConfigData() {
            try {
                const response = await fetch(CONFIG_API_BASE);
                const result = await response.json();
                
                if (result.success) {
                    return result.data || [];
                } else {
                    throw new Error(result.message || '获取数据失败');
                }
            } catch (error) {
                throw error;
            }
        }

        // 刷新数据
        function refreshData() {
            initConfigTable();
            layer.msg('数据已刷新', {icon: 1});
        }

        // 监听行工具栏事件
        layui.table.on('tool(configTable)', function(obj) {
            var data = obj.data;
            switch(obj.event) {
                case 'edit':
                    editConfig(data);
                    break;
            }
        });

        // 编辑系统配置
        function editConfig(data) {
            layer.open({
                type: 1,
                title: '编辑系统配置',
                content: `
                    <div style="padding: 20px;">
                        <form class="layui-form" id="editConfigForm">
                            <input type="hidden" name="id" value="${data.id}">
                            <div class="layui-form-item">
                                <label class="layui-form-label">配置键</label>
                                <div class="layui-input-block">
                                    <input type="text" name="configKey" required lay-verify="required" placeholder="配置键" autocomplete="off" class="layui-input" value="${data.configKey}" readonly>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <label class="layui-form-label">配置值</label>
                                <div class="layui-input-block">
                                    <input type="text" name="configValue" required lay-verify="required" placeholder="配置值" autocomplete="off" class="layui-input" value="${data.configValue}">
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <label class="layui-form-label">描述</label>
                                <div class="layui-input-block">
                                    <input type="text" name="description" placeholder="描述" autocomplete="off" class="layui-input" value="${data.description || ''}">
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <label class="layui-form-label">状态</label>
                                <div class="layui-input-block">
                                    <input type="radio" name="enabled" value="true" title="启用" ${data.enabled ? 'checked' : ''}>
                                    <input type="radio" name="enabled" value="false" title="禁用" ${!data.enabled ? 'checked' : ''}>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-input-block">
                                    <button class="layui-btn" lay-submit lay-filter="editConfigSubmit">立即提交</button>
                                    <button type="reset" class="layui-btn layui-btn-primary">重置</button>
                                </div>
                            </div>
                        </form>
                    </div>
                `,
                area: ['500px', '450px'],
                success: function(layero, index) {
                    layui.form.render();
                    layui.form.on('submit(editConfigSubmit)', function(formdata) {
                        editConfigSubmit(formdata.field, index);
                        return false;
                    });
                }
            });
        }

        // 编辑系统配置提交
        async function editConfigSubmit(data, index) {
            try {
                const response = await fetch(CONFIG_API_BASE, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        id: parseInt(data.id),
                        configValue: data.configValue,
                        description: data.description,
                        enabled: data.enabled === 'true'
                    })
                });

                const result = await response.json();

                if (result.success) {
                    layer.msg('更新成功', {icon: 1});
                    layer.close(index);
                    refreshData();
                } else {
                    layer.msg('更新失败: ' + result.message, {icon: 2});
                }
            } catch (error) {
                layer.msg('更新失败: ' + error.message, {icon: 2});
            }
        }
    </script>
</body>
