<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录 - 基金监控系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .login-header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .login-body {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            font-weight: 500;
            margin-bottom: 5px;
        }

        .form-control {
            height: 45px;
            border-radius: 8px;
            padding: 10px 15px;
        }

        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            height: 45px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .result {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            display: none;
        }

        .result.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .result.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .result.show {
            display: block;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <h1>🔐 用户登录</h1>
        <p>基金监控系统</p>
    </div>

    <div class="login-body">
        <form id="loginForm">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" class="form-control" id="username" placeholder="请输入用户名" required>
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" class="form-control" id="password" placeholder="请输入密码" required>
            </div>

            <button type="submit" class="btn btn-login w-100">登录</button>
        </form>

        <div class="result" id="loginResult"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // API基础路径
    const API_BASE = '/api/users';

    // 页面加载完成后检查登录状态
    document.addEventListener('DOMContentLoaded', function() {
        checkLoginStatus();
    });

    // 检查登录状态
    async function checkLoginStatus() {
        try {
            const response = await fetch(`${API_BASE}/status`);
            const result = await response.json();

            if (result.success) {
                // 已登录，跳转到主页
                window.location.href = 'index.html';
            }
        } catch (error) {
            console.log('检查登录状态失败:', error);
        }
    }

    // 表单提交处理
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        if (!username || !password) {
            showResult('loginResult', false, '请填写用户名和密码');
            return;
        }

        try {
            const response = await fetch(`${API_BASE}/login`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            });

            const result = await response.json();

            if (response.ok && result.success) {
                showResult('loginResult', true, '登录成功');
                // 延迟跳转到主页
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            } else {
                showResult('loginResult', false, result.message || '登录失败');
            }
        } catch (error) {
            showResult('loginResult', false, '登录失败: ' + error.message);
        }
    });

    // 显示结果
    function showResult(elementId, isSuccess, message) {
        const element = document.getElementById(elementId);
        element.textContent = message;
        element.className = 'result ' + (isSuccess ? 'success' : 'error') + ' show';

        // 3秒后自动隐藏
        setTimeout(() => {
            element.classList.remove('show');
        }, 3000);
    }
</script>
</body>
</html>
